// How much of a historic season's picks survived in the chat exports.
// Shown instead of form, because form off a 93%-complete record is a
// story about the gaps rather than about the player.
function coverageBar(p){
  const pctv = pct(p.verifiedDays, p.totalDays);
  return `<span class="mono" style="font-size:11.5px;color:var(--ash)" title="${p.verifiedDays} of ${p.totalDays} days verified against the spreadsheet">${pctv}%</span>`;
}

function viewResults(){
  const scope = allTime() ? (seasonsWithData()[0] || state.season) : state.season;
  const fx = state.fixtures.filter(f=> f.season === scope && kicked(f) && !VOID(f));
  if(!fx.length) return `<section class="panel"><h2>Results</h2>
    <div class="sub">Nothing played in ${esc(state.season||"this season")} yet.</div>
    ${seasonSeg()}
    <div class="empty">Pick an earlier season, or wait for kick-off.</div>${refreshRow()}</section>`;

  const mds = [...new Set(fx.map(f=>f.matchday))].sort((a,b)=>b-a);
  const md = state.resultsMd != null && mds.includes(state.resultsMd) ? state.resultsMd : mds[0];
  const list = fx.filter(f=>f.matchday===md).sort(byKickoff);

  const seg = `<div class="seg">${mds.slice(0,18).map(m=>
    `<button class="btn sm ghost segbtn" data-md="${m}" aria-pressed="${m===md}">MD ${m}</button>`).join("")}</div>`;

  const cols = state.players;
  const head = `<tr><th>Match</th><th class="num">Score</th><th class="res">Res</th>${
    cols.map(p=>`<th class="cell" title="${esc(p.name)}">${esc(p.name.slice(0,3))}</th>`).join("")}</tr>`;

  const body = list.map(f=>{
    const score = (f.hg==null||f.ag==null) ? "&ndash;" : `${f.hg}&ndash;${f.ag}`;
    const cells = cols.map(p=>{
      const pk = revealedPick(p.id, f.id);
      if(!pk) return `<td class="cell"><span class="b none">&middot;</span></td>`;
      if(!SETTLED(f)) return `<td class="cell"><span class="b">${pk}</span></td>`;
      return `<td class="cell"><span class="b ${pk===f.result?"ok":"no"}">${pk}</span></td>`;
    }).join("");
    const live = !SETTLED(f) ? ` <span class="tag live">${esc((f.status||"").toLowerCase())}</span>` : "";
    return `<tr><td>${esc(f.homeShort)} v ${esc(f.awayShort)}${live}</td>
      <td class="num">${score}</td><td class="res">${f.result||"&ndash;"}</td>${cells}</tr>`;
  }).join("");

  const tot = cols.map(p=>{
    const ok = list.filter(f=> SETTLED(f) && revealedPick(p.id,f.id)===f.result).length;
    return `<td class="cell">${ok}</td>`;
  }).join("");

  return `<section class="panel">
    <h2>Results</h2>
    <div class="sub">Everyone&rsquo;s calls, revealed at kick-off.${
      allTime() ? ` Showing ${esc(scope)} — pick a season to change it.` : ""}</div>
    ${seasonSeg()}
    ${seg}
    <div class="scroller" style="margin-top:10px">
      <table class="grid"><thead>${head}</thead><tbody>${body}
        <tr class="totals"><td colspan="3">Matchday points</td>${tot}</tr>
      </tbody></table>
    </div>
    ${refreshRow()}
  </section>`;
}

function wireResults(){
  wireCommon();
  $$(".segbtn[data-md]").forEach(b=> b.onclick = ()=>{ state.resultsMd = +b.dataset.md; render(); });
}

/* ---------------------------------------------------------------
   11. CHARTS  (hand-rolled SVG — keeps this a single file)
   --------------------------------------------------------------- */
const SWATCH = ["#d9a536","#4c9e69","#5b8cb8","#a5424e","#8e7cb0","#c17f45","#6fae8e","#b06a86","#7d94ad","#9a9a5c"];

function barChartSVG(items, opts={}){
  if(!items.length) return "";
  const W = opts.width||540, barH = opts.barH||19, gap = 8;
  const leftW = opts.leftW||92, rightW = opts.rightW||48;
  const plotW = Math.max(40, W-leftW-rightW);
  const max = opts.max || Math.max(1, ...items.map(it=>Math.abs(it.value)));
  const H = items.length*(barH+gap)+gap;
  const fmt = opts.valFmt || (v=>v);
  const rows = items.map((it,i)=>{
    const y = gap + i*(barH+gap);
    const w = it.value<=0 ? 0 : Math.max(2,(it.value/max)*plotW);
    return `<text x="${leftW-8}" y="${y+barH*0.72}" text-anchor="end" font-family="Space Mono" font-size="11" style="fill:var(--chalk)">${esc(it.label)}</text>
      <rect x="${leftW}" y="${y}" width="${plotW}" height="${barH}" rx="5" style="fill:rgba(233,238,247,.06)"/>
      <rect x="${leftW}" y="${y}" width="${w}" height="${barH}" rx="5" style="fill:${it.color||"var(--mark)"}"/>
      <text x="${leftW+plotW+8}" y="${y+barH*0.72}" font-family="Space Mono" font-size="11" style="fill:var(--mark)">${esc(String(fmt(it.value)))}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(opts.label||"chart")}">${rows}</svg>`;
}

// One line per player, cumulative points against matchday.
function cumulativeChart(s){
  const withData = s.players.filter(p=>p.scored>0);
  if(s.mds.length < 2 || !withData.length) return "";
  const W=540, H=200, padL=30, padR=10, padT=12, padB=22;
  const max = Math.max(1, ...withData.map(p=>p.series[p.series.length-1]));
  const stepX = (W-padL-padR)/Math.max(1, s.mds.length-1);
  const y = v => H-padB-(v/max)*(H-padT-padB);
  const grid = [0,.5,1].map(r=>{
    const yy = y(max*r);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" style="stroke:rgba(233,238,247,.09)"/>
      <text x="${padL-6}" y="${yy+3.5}" text-anchor="end" font-family="Space Mono" font-size="9.5" style="fill:var(--ash)">${Math.round(max*r)}</text>`;
  }).join("");
  const lines = withData.map((p,i)=>{
    const col = SWATCH[i % SWATCH.length];
    const d = p.series.map((v,j)=> (j?"L":"M")+(padL+j*stepX).toFixed(1)+","+y(v).toFixed(1)).join(" ");
    const last = p.series[p.series.length-1];
    return `<path d="${d}" fill="none" style="stroke:${col};stroke-width:2;stroke-linejoin:round"/>
      <circle cx="${(padL+(p.series.length-1)*stepX).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3" style="fill:${col}"/>`;
  }).join("");
  const ends = s.seriesLabels || [`MD ${s.mds[0]}`, `MD ${s.mds[s.mds.length-1]}`];
  const xlab = `<text x="${padL}" y="${H-6}" font-family="Space Mono" font-size="9.5" style="fill:var(--ash)">${esc(ends[0])}</text>
    <text x="${W-padR}" y="${H-6}" text-anchor="end" font-family="Space Mono" font-size="9.5" style="fill:var(--ash)">${esc(ends[1])}</text>`;
  const legend = withData.map((p,i)=>
    `<span><b style="background:${SWATCH[i%SWATCH.length]}"></b>${esc(p.name)}</span>`).join("");
  return `<div class="chart-card"><div class="ctitle">${allTime()?"Points, all time":"Points through the season"}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cumulative points">
      ${grid}${lines}${xlab}
    </svg><div class="legend">${legend}</div></div>`;
}

/* ---------------------------------------------------------------
   12. STATS
   --------------------------------------------------------------- */
function viewStats(){
  const s = computeSeason();
  if(!s.fixtureCount && !s.hasHistory){
    return `<section class="panel"><h2>Stats</h2>
      <div class="sub">Nothing settled in ${esc(state.season||"this season")} yet.</div>
      ${seasonSeg()}
      <div class="empty">Come back after a matchday, or pick an earlier season.</div>${refreshRow()}</section>`;
  }
  if(state.statPlayer){
    const p = s.players.find(x=>x.id===state.statPlayer);
    if(p) return playerPanel(p, s);
    state.statPlayer = null;
  }

  const MIN = 12;                        // sample floor before a rate-based award means anything
  const eligible = s.players.filter(p=>p.played >= MIN);
  const pool = eligible.length ? eligible : s.players.filter(p=>p.played>0);
  const best = (fn, from)=> (from||pool).reduce((b,p)=> (b===null || fn(p) > fn(b)) ? p : b, null);

  // Fixture-level superlatives
  const banana = s.drama.filter(d=>d.right===0).sort((a,b)=>b.calls.length-a.calls.length)[0];
  const gimme  = s.drama.filter(d=>d.right===d.calls.length).length;
  const wins = matchdayWinners(s);
  const mdWins = {}, mdShare = {};
  Object.values(wins).forEach(w=> w.winners.forEach(p=>{
    if(w.winners.length===1) mdWins[p.id]=(mdWins[p.id]||0)+1; else mdShare[p.id]=(mdShare[p.id]||0)+1;
  }));

  const bestMd = pool.map(p=>{
    const e = Object.entries(p.byMd).filter(([,v])=>v.n>=5).sort((a,b)=> b[1].ok-a[1].ok)[0];
    return e ? {p, md:+e[0], ok:e[1].ok, n:e[1].n} : null;
  }).filter(Boolean).sort((a,b)=> b.ok-a.ok || a.n-b.n)[0];

  const pair = pairStats(s);

  const tiles = [
    `<div class="key"><div class="big">${s.fixtureCount}</div><div class="lbl">Matches settled</div></div>`,
    `<div class="key"><div class="big">${pct(s.actual.H,s.fixtureCount)}/${pct(s.actual.D,s.fixtureCount)}/${pct(s.actual.A,s.fixtureCount)}</div><div class="lbl">Actual H / D / A split</div></div>`,
    `<div class="key"><div class="big">${gimme}</div><div class="lbl">Matches nobody got wrong</div></div>`,
    banana ? `<div class="key"><div class="big">0/${banana.calls.length}</div><div class="lbl">Banana skin · ${esc(banana.fixture.homeShort)} v ${esc(banana.fixture.awayShort)} (${banana.fixture.result})</div></div>` : "",
    (bestMd && !allTime()) ? `<div class="key"><div class="big">${bestMd.ok}/${bestMd.n}</div><div class="lbl">Best matchday · ${esc(bestMd.p.name)}, MD${bestMd.md}</div></div>` : ""
  ].join("");

  const A = [];
  const add = (label, ok, html, note)=>{ if(ok) A.push(
    `<li><span>${label}${note?`<br><span class="aw">${note}</span>`:""}</span><span class="pts">${html}</span></li>`); };

  const sharp     = best(p=>p.acc);
  const drawer    = best(p=>p.byPick.D.ok);
  const drawShy   = pool.reduce((b,p)=> (b===null || p.byPick.D.n < b.byPick.D.n) ? p : b, null);
  const homer     = best(p=>p.byPick.H.n/Math.max(1,p.played));
  const awayday   = best(p=>p.byPick.A.n/Math.max(1,p.played));
  const maverick  = pool.reduce((b,p)=> (p.herdN>=MIN && (b===null || p.withHerd/p.herdN < b.withHerd/b.herdN)) ? p : b, null);
  const sheep     = pool.reduce((b,p)=> (p.herdN>=MIN && (b===null || p.withHerd/p.herdN > b.withHerd/b.herdN)) ? p : b, null);
  const soloist   = best(p=>p.solo);
  const clown     = best(p=>p.blind);
  const streaker  = best(p=>p.bestStreak);
  const absentee  = best(p=>p.missed);
  const mdKing    = s.players.reduce((b,p)=> (b===null || (mdWins[p.id]||0) > (mdWins[b.id]||0)) ? p : b, null);

  const teamAward = (want)=>{
    let out = null;
    pool.forEach(p=> Object.entries(p.teams).forEach(([t,v])=>{
      if(v.n < 6) return;
      const rate = v.ok/v.n;
      if(!out || (want==="best" ? rate > out.rate : rate < out.rate)) out = {p, t, rate, n:v.n, ok:v.ok};
    }));
    return out;
  };
  const bogey = teamAward("worst"), charm = teamAward("best");

  add("Sharpest",           sharp && sharp.played,        `${esc(sharp.name)} · ${sharp.acc}%`, "highest strike rate");
  add("Draw specialist",    drawer && drawer.byPick.D.ok, `${esc(drawer.name)} · ${drawer.byPick.D.ok}/${drawer.byPick.D.n}`, "the hardest call to get right");
  // A one-sided award is meaningless when the same player takes both
  // ends of it — that just means the sample is too thin to separate.
  add("Draw denier",        drawShy && drawShy!==drawer,  drawShy && `${esc(drawShy.name)} · ${drawShy.byPick.D.n} draws called`, "calls the fewest draws");
  add("Homer",              homer,                        homer && `${esc(homer.name)} · ${pct(homer.byPick.H.n,homer.played)}% H`, "backs the home side most often");
  add("Away backer",  awayday && awayday!==homer && awayday.byPick.A.n, awayday && `${esc(awayday.name)} · ${pct(awayday.byPick.A.n,awayday.played)}% A`, "");
  add("Maverick",           !!maverick,                   maverick && `${esc(maverick.name)} · ${pct(maverick.withHerd,maverick.herdN)}% with the group`, "least often with the majority");
  add("With the room",              !!sheep && sheep!==maverick,  sheep && `${esc(sheep.name)} · ${pct(sheep.withHerd,sheep.herdN)}% with the group`, "most often with the majority");
  add("Against the room",        soloist && soloist.solo,      soloist && `${esc(soloist.name)} · ${soloist.solo}`, "right when everyone else was wrong");
  add("Only one who missed",clown && clown.blind,         clown && `${esc(clown.name)} · ${clown.blind}`, "wrong when everyone else was right");
  add("Longest run",        streaker && streaker.bestStreak>2, streaker && `${esc(streaker.name)} · ${streaker.bestStreak} in a row`, "");
  add("Most matchdays won",      mdKing && (mdWins[mdKing.id]||0)>0, mdKing && `${esc(mdKing.name)} · ${mdWins[mdKing.id]}`, "outright weekly wins");
  add("Bogey team",         !!bogey,                      bogey && `${esc(bogey.p.name)} · ${esc(bogey.t)} ${bogey.ok}/${bogey.n}`, "worst read on one club");
  const sameEntry = bogey && charm && bogey.p===charm.p && bogey.t===charm.t;
  add("Lucky charm",        charm && !sameEntry,          charm && `${esc(charm.p.name)} · ${esc(charm.t)} ${charm.ok}/${charm.n}`, "");
  add("Shared brain",       !!pair.closest,               pair.closest && `${esc(pair.closest.a)} &amp; ${esc(pair.closest.b)} · ${pair.closest.rate}%`, "most identical calls");
  add("Never agree",        !!pair.furthest,              pair.furthest && `${esc(pair.furthest.a)} &amp; ${esc(pair.furthest.b)} · ${pair.furthest.rate}%`, "");
  add("Ghost",              absentee && absentee.missed>0, absentee && `${esc(absentee.name)} · ${absentee.missed}`, "most deadlines missed");

  const accChart = barChartSVG(
    [...s.players].filter(p=>p.scored>0).sort((a,b)=>b.acc-a.acc).map((p,i)=>({label:p.name, value:p.acc, color:SWATCH[i%SWATCH.length]})),
    {valFmt:v=>v+"%", label:"strike rate"});

  const styleChart = pickMixChart(s);

  const drill = s.players.filter(p=>p.played>0).map(p=>
    `<button class="btn sm ghost segbtn" data-player="${esc(p.id)}">${esc(p.name)}</button>`).join("");

  return `<section class="panel">
    <h2>Stats</h2>
    <div class="sub">Minimum ${MIN} calls for a rate-based award.</div>
    ${seasonSeg()}
    ${coverageNote(s)}
    <div class="keys" style="margin-top:14px">${tiles}</div>
    <h3 class="sect">Awards</h3>
    <ul class="awards">${A.join("")}</ul>
    <div class="chart-card"><div class="ctitle">Strike rate</div>${accChart}</div>
    ${styleChart}
    <h3 class="sect">Player profiles</h3>
    <div class="seg">${drill}</div>
    ${refreshRow()}
  </section>`;
}

// A historic season's picks are ~93% recovered, and only the days that
// reconciled exactly against the spreadsheet are used below. Saying so
// is the difference between a statistic and a guess.
function coverageNote(s){
  if(!s.hasHistory) return "";
  const seen = s.players.reduce((n,p)=> n + p.played, 0);
  const days = s.players.reduce((n,p)=> n + p.verifiedDays, 0);
  const all  = s.players.reduce((n,p)=> n + p.totalDays, 0);
  return `<div class="chart-card" style="margin-top:12px">
    <div class="ctitle">What these are built on</div>
    <div class="sub" style="margin:0 0 10px">
      Points and the table come from the group's spreadsheet${allTime()?", plus the app's own record for the live season,":""} and are exact.
      Everything below reads individual calls rebuilt from the chat history, and only from the
      <b>${days} of ${all}</b> player-days that reconciled against the spreadsheet exactly
      — <b>${seen}</b> calls in all. Days where the record is incomplete are left out rather
      than guessed at, so a rate here is a rate over what survived.
    </div></div>`;
}

// Agreement between every pair, over the fixtures both of them called.
function pairStats(s){
  let closest = null, furthest = null;
  const ps = s.players.filter(p=>p.played>0);
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    let same=0, n=0;
    s.fixtures.forEach(f=>{
      const a = revealedPick(ps[i].id,f.id), b = revealedPick(ps[j].id,f.id);
      if(!a||!b) return;
      n++; if(a===b) same++;
    });
    if(n < 12) continue;
    const rate = pct(same,n);
    const rec = {a:ps[i].name, b:ps[j].name, rate, n};
    if(!closest  || rate > closest.rate)  closest  = rec;
    if(!furthest || rate < furthest.rate) furthest = rec;
  }
  return {closest, furthest: (closest && furthest && closest.a===furthest.a && closest.b===furthest.b) ? null : furthest};
}

// How each player's H/D/A habit compares to how the season actually went.
function pickMixChart(s){
  const ps = s.players.filter(p=>p.played>0);
  if(!ps.length) return "";
  const rows = [
    {name:"Reality", H:pct(s.actual.H,s.fixtureCount), D:pct(s.actual.D,s.fixtureCount), A:pct(s.actual.A,s.fixtureCount)},
    ...ps.map(p=>({name:p.name, H:pct(p.byPick.H.n,p.played), D:pct(p.byPick.D.n,p.played), A:pct(p.byPick.A.n,p.played)}))
  ];
  const W=540, rowH=22, gap=7, leftW=92, plotW=W-leftW-14;
  const H = rows.length*(rowH+gap)+gap;
  const cols = {H:"#4c9e69", D:"#d9a536", A:"#5b8cb8"};
  const bars = rows.map((r,i)=>{
    const y = gap+i*(rowH+gap);
    let x = leftW;
    const segs = ["H","D","A"].map(k=>{
      const w = (r[k]/100)*plotW;
      const seg = `<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(0,w).toFixed(1)}" height="${rowH}" style="fill:${cols[k]};opacity:${i?0.85:1}"/>` +
        (w>26 ? `<text x="${(x+w/2).toFixed(1)}" y="${y+rowH*0.7}" text-anchor="middle" font-family="Space Mono" font-size="10" style="fill:#0b0d10;font-weight:700">${r[k]}</text>` : "");
      x += w; return seg;
    }).join("");
    return `<text x="${leftW-8}" y="${y+rowH*0.7}" text-anchor="end" font-family="Space Mono" font-size="11" style="fill:${i?"var(--chalk)":"var(--ash)"}">${esc(r.name)}</text>${segs}`;
  }).join("");
  return `<div class="chart-card"><div class="ctitle">Calling style vs how the season actually went</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pick mix">${bars}</svg>
    <div class="legend"><span><b style="background:#4c9e69"></b>Home</span><span><b style="background:#d9a536"></b>Draw</span><span><b style="background:#5b8cb8"></b>Away</span></div></div>`;
}

function playerPanel(p, s){
  const line = (k)=>{
    const v = p.byPick[k];
    return `<li><span>${PICK_WORD[k]}s called</span><span class="pts">${v.ok}/${v.n} · ${pct(v.ok,v.n)}%</span></li>`;
  };
  const teams = Object.entries(p.teams).filter(([,v])=>v.n>=4).sort((a,b)=> (b[1].ok/b[1].n)-(a[1].ok/a[1].n));
  const bestT = teams.slice(0,3), worstT = teams.slice(-3).reverse();
  const mdRows = Object.entries(p.byMd).sort((a,b)=>a[0]-b[0]).map(([m,v])=>({label:"MD"+m, value:v.ok}));
  const rank = s.players.findIndex(x=>x.id===p.id)+1;

  return `<section class="panel">
    <div class="row" style="margin-bottom:10px"><button class="btn ghost sm" id="backStats" style="flex:0 0 auto">&lsaquo; All stats</button></div>
    <h2>${esc(p.name)}</h2>
    <div class="sub">${rank}${["st","nd","rd"][rank-1]||"th"} of ${s.players.length} · ${p.points} from ${p.scored}${
      p.hasTruth ? ` · ${p.played} calls recovered` : ""}</div>
    <div class="keys" style="margin-top:14px">
      <div class="key"><div class="big">${p.acc}%</div><div class="lbl">Strike rate</div></div>
      <div class="key"><div class="big">${p.bestStreak}</div><div class="lbl">Longest run</div></div>
      <div class="key"><div class="big">${p.solo}</div><div class="lbl">Right when all others wrong</div></div>
      <div class="key"><div class="big">${p.herdN?pct(p.withHerd,p.herdN):0}%</div><div class="lbl">Voted with the group</div></div>
      ${p.hasTruth
        ? `<div class="key"><div class="big">${pct(p.verifiedDays,p.totalDays)}%</div><div class="lbl">Of this season's days verified</div></div>`
        : `<div class="key"><div class="big">${p.missed}</div><div class="lbl">Deadlines missed</div></div>`}
    </div>
    <ul class="awards">${PICKS.map(line).join("")}</ul>
    ${bestT.length ? `<ul class="awards">
      <li><span>Reads them best</span><span class="pts">${bestT.map(([t,v])=>`${esc(t)} ${v.ok}/${v.n}`).join("<br>")}</span></li>
      <li><span>Hasn't a clue</span><span class="pts">${worstT.map(([t,v])=>`${esc(t)} ${v.ok}/${v.n}`).join("<br>")}</span></li>
    </ul>` : ""}
    <div class="chart-card"><div class="ctitle">Points per matchday</div>${barChartSVG(mdRows,{barH:14,leftW:52})}</div>
    ${refreshRow()}
  </section>`;
}

function wireStats(){
  wireCommon();
  $$(".segbtn[data-player]").forEach(b=> b.onclick = ()=>{ state.statPlayer=b.dataset.player; render(); window.scrollTo(0,0); });
  $("#backStats") && ($("#backStats").onclick = ()=>{ state.statPlayer=null; render(); });
}

/* ---------------------------------------------------------------
   13. GO
   --------------------------------------------------------------- */
$$("#tabs button").forEach(b=> b.onclick = async ()=>{
  // Leaving mid-run still saves what was called, and unbinds the key
  // handler — otherwise h/d/a would keep firing on another tab.
  if(state.entry){ await flushEntry(); state.entry = null; }
  state.tab = b.dataset.view; state.statPlayer = null; state.identityOpen = false;
  render(); window.scrollTo(0,0);
});
// A pick can lock while the page sits open on a Saturday afternoon.
setInterval(()=>{
  if(state.tab!=="predict" || state.identityOpen || state.entry) return;
  if(document.activeElement === $("#bulkBox")) return;   // don't yank the caret mid-string
  render();
}, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(true); });
boot();
</script>
