<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Premier League Predictions</title>
<meta name="description" content="H, A or D before kick-off. Predictions, results and a season's worth of arguing, for a group of friends." />
<meta name="theme-color" content="#0b0d10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Predictions" />
<!-- Relative paths throughout: the manifest's URLs resolve against the
     manifest itself, so this works under /pl-predictions/ without the
     repo name being written down anywhere. iOS ignores the manifest's
     icons and uses apple-touch-icon, hence both. -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     THEME — Results page
     A football results page, not a dashboard: flat surfaces,
     hairline rules, condensed caps for headers, monospace for every
     figure so columns line up. One accent colour, used sparingly.
       --ink    #0b0d10  page
       --paper  #101318  panel
       --chalk  #e4e7ea  primary text
       --ash    #79818c  secondary text
       --rule   #22272e  hairlines
       --mark   #d9a536  the one accent
       --ok     #4c9e69  correct call
       --no     #a5424e  wrong call
     ============================================================ */
  :root{
    --ink:#0b0d10; --paper:#101318; --raise:#161a20;
    --chalk:#e4e7ea; --ash:#79818c; --rule:#22272e;
    --mark:#d9a536; --ok:#4c9e69; --no:#a5424e; --cool:#5b8cb8;
    --r:5px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:15.5px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,h4{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.05em;margin:0}
  .mono{font-family:"Space Mono",ui-monospace,monospace}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  a{color:var(--mark)}

  /* env() is 0 in a browser tab and the real inset once installed to
     the home screen, where the status bar sits over the page. */
  .wrap{max-width:800px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 56px}

  /* ---------- Masthead ---------- */
  header.top{display:flex;align-items:flex-end;gap:10px;padding:12px 0 10px;border-bottom:2px solid var(--chalk)}
  header.top h1{font-size:27px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
  header.top .sub{color:var(--ash);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:3px}
  .whoami{margin-left:auto;display:flex;align-items:center;gap:7px}
  .whoami button{background:transparent;border:1px solid var(--rule);color:var(--chalk);
    border-radius:var(--r);padding:6px 11px;font-size:13px;font-weight:500}
  .whoami button:hover{border-color:var(--ash)}
  .whoami .sync{width:34px;padding:0;height:32px;display:grid;place-items:center;font-size:15px;line-height:1}
  .whoami .sync.spin{color:var(--mark);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Tabs ---------- */
  nav.tabs{display:flex;gap:0;margin:0 0 18px;border-bottom:1px solid var(--rule)}
  nav.tabs button{
    flex:1 1 auto;background:transparent;border:none;border-bottom:2px solid transparent;
    color:var(--ash);padding:11px 6px;font-size:11.5px;letter-spacing:.16em;
    text-transform:uppercase;font-family:"Barlow Condensed";font-weight:600;transition:.15s;
  }
  nav.tabs button:hover{color:var(--chalk)}
  nav.tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--mark)}

  /* ---------- Panels ---------- */
  .panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
    padding:16px;margin-bottom:14px}
  .panel h2{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk)}
  .panel .sub{color:var(--ash);font-size:13px;margin-top:2px}
  h3.sect{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);
    margin:22px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--rule)}

  label.fld{display:block;margin:14px 0 6px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
  input[type=text],select{
    width:100%;background:var(--ink);border:1px solid var(--rule);color:var(--chalk);
    border-radius:var(--r);padding:11px 13px;font-size:16px;outline:none;
  }
  input:focus,select:focus{border-color:var(--mark)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--chalk);color:var(--ink);border:1px solid var(--chalk);border-radius:var(--r);
    padding:11px 16px;font-size:12.5px;font-weight:700;letter-spacing:.1em;
    font-family:"Barlow Condensed";text-transform:uppercase;width:100%;transition:.13s}
  .btn:hover{background:#fff;border-color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.3;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ash);border-color:var(--rule)}
  .btn.ghost:hover{background:transparent;color:var(--chalk);border-color:var(--ash)}
  .btn.sm{padding:7px 12px;font-size:11.5px;width:auto}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > *{flex:1}

  /* ---------- Bulk entry ---------- */
  details.paste{margin-top:10px}
  details.paste summary{cursor:pointer;list-style:none;font-size:12px;color:var(--ash);
    padding:6px 0;text-align:center}
  details.paste summary::-webkit-details-marker{display:none}
  details.paste summary:hover{color:var(--chalk)}
  .bulk{border:1px solid var(--rule);border-radius:var(--r);padding:12px;background:var(--ink)}
  .bulk input{font-family:"Space Mono";font-size:21px;letter-spacing:.4em;text-transform:uppercase;
    text-align:center;text-indent:.4em;background:transparent;border-color:var(--rule)}
  .bulk .hint{color:var(--ash);font-size:12px;margin-top:8px;text-align:center;min-height:1.4em}
  .bulk .tally{font-family:"Space Mono";color:var(--mark)}
  .bulk .bad{color:var(--no);font-weight:500}

  /* ---------- Fixture rows ---------- */
  .daybar{display:flex;align-items:baseline;gap:9px;margin:18px 0 0;padding-bottom:4px;
    border-bottom:1px solid var(--rule)}
  .daybar h3{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk)}
  .daybar .md{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);margin-left:auto}

  .fx{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--rule)}
  .fx:last-child{border-bottom:none}
  .fx .ko{font-family:"Space Mono";font-size:12px;color:var(--ash);text-align:right;line-height:1.3}
  .fx .ko.moved{color:var(--mark)}
  .fx .teams{min-width:0;font-size:14px;line-height:1.34}
  .fx .teams .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx .teams .note{font-size:11px;color:var(--ash)}
  .fx.locked .teams{color:var(--ash)}

  .picks{display:flex;gap:4px}
  .pk{width:36px;height:34px;border-radius:var(--r);border:1px solid var(--rule);background:transparent;
    color:var(--ash);font-family:"Space Mono";font-weight:700;font-size:13px;transition:.12s;padding:0}
  .pk:hover{color:var(--chalk);border-color:var(--ash)}
  .pk[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
  .pk.preview{border-color:var(--mark);color:var(--mark);border-style:dashed}
  .pk[disabled]{opacity:.4;cursor:not-allowed}

  /* Who has called it, by initial. Never which way. */
  .whodunnit{display:flex;gap:4px;margin-top:4px}
  .whodunnit span{font-family:"Space Mono";font-size:9.5px;line-height:1;letter-spacing:.02em;
    min-width:15px;height:14px;padding:0 3px;display:inline-grid;place-items:center;
    border:1px solid var(--rule);border-radius:3px;color:#4d5560;background:transparent}
  .whodunnit span.in{border-color:var(--ok);color:#06180d;background:var(--ok);font-weight:700}
  .whodunnit span.me{border-style:dashed}
  .whodunnit span.in.me{border-style:solid}
  .whoweek{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;padding-top:10px;
    border-top:1px solid var(--rule);font-size:12.5px;color:var(--ash)}
  .tallyman{display:inline-flex;align-items:center;gap:6px}
  .tallyman.done{color:var(--chalk)}
  .keymark{font-family:"Space Mono";font-size:9.5px;min-width:15px;height:14px;padding:0 3px;
    display:inline-grid;place-items:center;border:1px solid var(--rule);border-radius:3px;
    color:#4d5560;vertical-align:middle;margin-right:2px}
  .keymark.in{border-color:var(--ok);color:#06180d;background:var(--ok);font-weight:700}

  /* Matchweek pager */
  .weekbar{display:flex;align-items:center;gap:10px;margin:14px 0 0;
    border:1px solid var(--rule);border-radius:var(--r);padding:6px}
  .wknav{width:40px;height:38px;flex:0 0 auto;background:transparent;border:1px solid var(--rule);
    border-radius:var(--r);color:var(--chalk);font-size:19px;line-height:1;transition:.12s}
  .wknav:hover:not([disabled]){border-color:var(--ash)}
  .wknav[disabled]{opacity:.25;cursor:not-allowed}
  .wklabel{flex:1;text-align:center;line-height:1.3}
  .wklabel b{font-family:"Barlow Condensed";font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;display:block}
  .wklabel span{font-size:11.5px;color:var(--ash)}

  /* Focused entry — one fixture, filling the screen, no list to scroll */
  .entry{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .entry .ehead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
  .entry .ehead .etitle{font-family:"Barlow Condensed";font-size:14px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ash)}
  .entry .ehead .eclose{margin-left:auto;background:transparent;border:1px solid var(--rule);
    color:var(--chalk);border-radius:var(--r);padding:7px 13px;font-size:12.5px}
  .eprog{display:flex;gap:3px;margin:12px 0 0}
  .eprog i{flex:1;height:3px;background:var(--rule);border-radius:2px}
  .eprog i.done{background:var(--ok)}
  .eprog i.at{background:var(--mark)}
  .ebody{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:6px;min-height:0}
  .ebody .ewhen{font-family:"Space Mono";font-size:12.5px;color:var(--ash);letter-spacing:.04em}
  .ebody .eteam{font-family:"Barlow Condensed";font-weight:600;font-size:clamp(28px,9vw,44px);
    line-height:1.05;letter-spacing:.02em}
  .ebody .ev{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash);margin:2px 0}
  .ebody .ecount{font-family:"Space Mono";font-size:12px;color:var(--ash);margin-top:14px}
  .ebtns{display:flex;flex-direction:column;gap:9px}
  .ebtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:transparent;border:1px solid var(--rule);border-radius:var(--r);
    color:var(--chalk);padding:15px 16px;font-size:16px;transition:.12s}
  .ebtn:hover{border-color:var(--ash)}
  .ebtn[aria-pressed="true"]{border-color:var(--chalk);background:rgba(255,255,255,.05)}
  .ebtn kbd{font-family:"Space Mono";font-size:13px;font-weight:700;min-width:30px;height:30px;
    display:inline-grid;place-items:center;border:1px solid var(--rule);border-radius:5px;color:var(--ash)}
  .ebtn[aria-pressed="true"] kbd{border-color:var(--chalk);color:var(--chalk)}
  .ebtn .elabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .efoot{display:flex;gap:9px;margin-top:12px}
  .efoot .btn{flex:1}
  .edone{text-align:center;padding:20px 0}
  .edone .big{font-family:"Space Mono";font-size:34px;color:var(--mark)}

  /* Deadline nudge */
  .nudge{margin-top:12px;padding:10px 12px;border:1px solid var(--mark);border-left-width:3px;
    border-radius:var(--r);background:rgba(217,165,54,.07);font-size:13.5px;line-height:1.5}
  .nudge b{display:block;font-weight:600;color:var(--mark)}

  /* ---------- Tables ---------- */
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.grid{border-collapse:collapse;width:100%;font-size:13px}
  table.grid th,table.grid td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
  table.grid thead th{border-bottom:1px solid var(--ash)}
  table.grid th{font-family:"Barlow Condensed";font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ash);font-weight:600}
  table.grid td.num,table.grid th.num{font-family:"Space Mono";text-align:right}
  table.grid tbody tr:hover td{background:rgba(255,255,255,.02)}
  table.grid tr.me td:first-child{box-shadow:inset 2px 0 0 var(--mark)}
  table.grid tr.me td{background:rgba(217,165,54,.05)}
  table.grid td.cell,table.grid th.cell{text-align:center;font-family:"Space Mono";font-weight:700;width:36px;padding:6px 4px}
  table.grid tr.totals td{border-bottom:none;border-top:1px solid var(--ash);font-weight:700}
  .cell .b{display:inline-grid;place-items:center;width:24px;height:22px;border-radius:3px;
    background:transparent;border:1px solid var(--rule);color:var(--ash);font-size:12px}
  .cell .b.ok{background:var(--ok);border-color:var(--ok);color:#06180d}
  .cell .b.no{background:transparent;border-color:var(--no);color:var(--no)}
  .cell .b.none{border-color:transparent;color:var(--rule)}
  .res{font-family:"Space Mono";font-weight:700;text-align:center}

  .form{display:flex;gap:2px}
  .form i{width:8px;height:12px;background:var(--rule);display:block}
  .form i.ok{background:var(--ok)}
  .form i.no{background:var(--no);opacity:.5}
  .streak{font-family:"Space Mono";font-size:11px;color:var(--mark)}

  /* ---------- Key figures ---------- */
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));
    border-top:1px solid var(--rule);margin:14px 0 4px}
  .key{padding:11px 12px 11px 0;border-bottom:1px solid var(--rule)}
  .key .big{font-family:"Space Mono";font-size:20px;color:var(--chalk);line-height:1.2}
  .key .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin-top:3px;line-height:1.45}

  /* ---------- Awards ---------- */
  .awards{list-style:none;padding:0;margin:6px 0 0}
  .awards li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
    padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .awards li:last-child{border-bottom:none}
  .awards li .pts{font-family:"Space Mono";font-size:13px;color:var(--mark);text-align:right;white-space:nowrap}
  .awards li .aw{color:var(--ash);font-size:12px;display:block;margin-top:1px}

  .chart-card{border:1px solid var(--rule);border-radius:var(--r);padding:12px 12px 4px;margin:12px 0}
  .chart-card .ctitle{font-family:"Barlow Condensed";font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ash);margin-bottom:8px}
  .chart-card svg{display:block;width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 8px;font-size:11px;color:var(--ash)}
  .legend b{display:inline-block;width:8px;height:8px;margin-right:5px}

  .seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .seg .segbtn{flex:0 0 auto}
  .seg .segbtn[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
  .empty{color:var(--ash);text-align:center;padding:26px 0;font-size:14px}
  .tag{display:inline-block;font-family:"Space Mono";font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;border:1px solid var(--rule);border-radius:3px;padding:1px 5px;color:var(--ash)}
  .tag.live{border-color:var(--mark);color:var(--mark)}
  .foot{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
    color:var(--ash);font-size:11.5px;margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
  .foot .tag{border:none;padding:0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;
    background:var(--chalk);color:var(--ink);font-weight:600;font-size:13.5px;
    padding:10px 16px;border-radius:var(--r);max-width:88vw;text-align:center}
  .toast.bad{background:var(--no);color:#fff}
  .namelist{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
  .namelist button{background:transparent;border:1px solid var(--rule);color:var(--chalk);
    border-radius:var(--r);padding:9px 15px;font-size:15px;font-weight:500}
  .namelist button:hover{border-color:var(--ash)}
  .namelist button[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}

  @media (max-width:400px){
    .fx{grid-template-columns:38px 1fr auto;gap:8px}
    .pk{width:33px;height:32px}
    header.top h1{font-size:23px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
  :focus-visible{outline:1px solid var(--mark);outline-offset:2px}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="sub">Premier League</div>
      <h1>Predictions</h1>
    </div>
    <div class="whoami" id="whoami"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="predict" aria-selected="true">Predict</button>
    <button data-view="table">Table</button>
    <button data-view="results">Results</button>
    <button data-view="stats">Stats</button>
  </nav>

  <main id="app"></main>

  <div class="foot">
    <span class="tag" id="storeBadge">&hellip;</span>
    <span id="syncBadge"></span>
  </div>
</div>

<script>
/* ================================================================
   PREMIER LEAGUE PREDICTIONS
   Single-file, host-anywhere. No build step, no framework.

   THE GAME: before kick-off, every player calls each match H (home
   win), A (away win) or D (draw). One point per correct call. That's
   the whole ruleset — everything else in here is bookkeeping and
   arguing material.

   ORDER MATTERS. Fixtures sort by kick-off time, then alphabetically
   by home team inside a shared kick-off — the same order FotMob
   shows, and the order the group has always typed its strings in.
   The bulk box maps "HAHHA" onto that sequence one character at a
   time, with "_" to skip, so a WhatsApp message pastes straight in.

   KICK-OFF IS THE LOCK. The database refuses a write once a fixture
   has started (see schema.sql) and refuses to serve anyone's pick
   until then, so nobody can peek and nobody can back-date. Your own
   un-kicked-off picks are mirrored locally, which is why they're
   still visible to you and only you.

   FIXTURES arrive from football-data.org via a GitHub Action
   (scripts/sync-fixtures.mjs) that upserts into pl_fixtures. The app
   never calls that API directly — no key in the page, no CORS.
   ================================================================ */

/* ---------------------------------------------------------------
   1. CONFIG + STORAGE
   --------------------------------------------------------------- */
const CONFIG = {
  supabase: {
    url: "https://iyojwrkfqcxpwdoigmuz.supabase.co",
    anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5b2p3cmtmcWN4cHdkb2lnbXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2Mzc1NTQsImV4cCI6MjA5ODIxMzU1NH0.rtduCfAYXYc2GtUZIE2TXKYKYzSp429y-IakQ5t43YE"
  },
  maxPlayers: 10
};

const mem = new Map();
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch { return mem.get(k) ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch { mem.set(k,v); } },
  del(k){ try { localStorage.removeItem(k); } catch { mem.delete(k); } },
  json(k,fb){ const r=this.get(k); if(!r) return fb; try{ return JSON.parse(r); }catch{ this.del(k); return fb; } }
};
const K = { me:"pl_me", pin:"pl_pin", name:"pl_name", admin:"pl_admin", pending:"pl_pending",
            fixtures:"pl_cache_fixtures", players:"pl_cache_players", picks:"pl_cache_picks",
            history:"pl_cache_history", mine:"pl_cache_mine" };

/* Dependency-free PostgREST client. Same shape as the whist app's
   adapter: reads fall back to the local mirror, writes go through
   and surface their error rather than failing silently. */
const SB = {
  _h(extra){ const k = CONFIG.supabase.anonKey;
    return { apikey:k, Authorization:`Bearer ${k}`, "Content-Type":"application/json", ...(extra||{}) }; },
  _url(p){ return CONFIG.supabase.url.replace(/\/$/,"") + "/rest/v1/" + p; },
  // PostgREST answers with at most 1000 rows and a 206, so a single
  // GET silently truncates. Six seasons is 2280 fixtures and ~5000
  // picks, so without paging the app shows a third of the history and
  // every total is quietly wrong. Paging needs a deterministic order
  // or rows repeat or vanish across page boundaries — hence the id
  // tiebreaks on each caller.
  async get(path){
    const PAGE = 1000;
    const out = [];
    for(let from = 0; ; from += PAGE){
      const res = await fetch(this._url(path), {
        headers: this._h({ "Range-Unit":"items", Range: from + "-" + (from + PAGE - 1) })
      });
      if(!res.ok) throw new Error("HTTP "+res.status+" "+(await res.text()));
      const rows = await res.json();
      out.push(...rows);
      if(rows.length < PAGE) return out;
      if(out.length > 100000) return out;                 // runaway guard
    }
  },
  async rpc(fn, args){
    const res = await fetch(this._url("rpc/" + fn), {
      method:"POST", headers:this._h(), body:JSON.stringify(args)
    });
    const text = await res.text();
    if(!res.ok) throw new Error("HTTP "+res.status+" "+text);
    return text ? JSON.parse(text) : null;
  },
  async post(path, body, prefer){
    const res = await fetch(this._url(path), {
      method:"POST", headers:this._h({ Prefer: prefer || "return=minimal" }), body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error("HTTP "+res.status+" "+(await res.text()));
    return res;
  }
};

/* ---------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b)=> b ? Math.round(a/b*100) : 0;
const PICKS = ["H","A","D"];                  // accepted letters, any order
const PICK_ORDER = ["H","D","A"];             // how the buttons sit: home, draw, away
const PICK_WORD = { H:"Home win", A:"Away win", D:"Draw" };

// Distinct initials for the marker row. One letter each unless two
// players collide, in which case everyone gets two.
function initialsFor(names){
  const one = names.map(n => n.trim().slice(0,1).toUpperCase());
  const clash = one.some((v,i)=> one.indexOf(v) !== i);
  return Object.fromEntries(names.map((n,i)=> [n, clash ? n.trim().slice(0,2) : one[i]]));
}

const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false});
const fmtDay  = iso => new Date(iso).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"});
const dayKey  = iso => { const d=new Date(iso); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); };

let toastTimer = null;
function toast(msg, bad){
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  $(".toast")?.remove();
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.remove(), bad ? 5200 : 2400);
}

/* ---------------------------------------------------------------
   3. FIXTURE MODEL
   --------------------------------------------------------------- */
const VOID = f => f.status==="POSTPONED" || f.status==="CANCELLED";
const SETTLED = f => f.result === "H" || f.result === "A" || f.result === "D";
const kicked = f => Date.now() >= new Date(f.kickoff).getTime();
const open   = f => !VOID(f) && !kicked(f);

// The one true ordering: kick-off, then home team alphabetically.
function byKickoff(a,b){
  const d = new Date(a.kickoff) - new Date(b.kickoff);
  return d !== 0 ? d : a.home.localeCompare(b.home);
}

function rowToFixture(r){
  return {
    id:r.id, matchday:r.matchday||0, season:r.season,
    kickoff:r.kickoff_utc, kickoffOriginal:r.kickoff_original || r.kickoff_utc,
    home:r.home, away:r.away, homeShort:r.home_short||r.home, awayShort:r.away_short||r.away,
    status:r.status, hg:r.home_goals, ag:r.away_goals, result:r.result
  };
}
const moved = f => f.kickoffOriginal && f.kickoff !== f.kickoffOriginal;

function pickKey(playerId, fixtureId){ return playerId + "|" + fixtureId; }

// Your own pick for a fixture: the server's copy once revealed,
// otherwise the local mirror of what you sent before kick-off.
function myPick(fixtureId){
  if(!state.me) return null;
  const served = state.picks.get(pickKey(state.me, fixtureId));
  if(served && served.pick) return served.pick;             // revealed at kick-off
  return state.pending[fixtureId] || state.myPicks[fixtureId] || (served ? "?" : null);
}
function hasPicked(playerId, fixtureId){
  if(state.picks.has(pickKey(playerId, fixtureId))) return true;
  return playerId === state.me && !!state.pending[fixtureId];
}
// A revealed pick, or null if it's still under wraps / never made.
function revealedPick(playerId, fixtureId){
  const p = state.picks.get(pickKey(playerId, fixtureId));
  return p && p.pick ? p.pick : null;
}

/* ---------------------------------------------------------------
   4. STATE + BOOT
   --------------------------------------------------------------- */
const state = {
  tab: "predict",
  players: [],                 // [{id,name}]
  fixtures: [],                // sorted by kickoff
  picks: new Map(),            // "playerId|fixtureId" -> {pick|null, revealed}
  history: [],                 // authoritative per-day scores from the group's spreadsheet
  myPicks: {},                 // fixtureId -> pick, mine only, readable because we hold the code
  pending: {},                 // fixtureId -> "H"|"A"|"D"  (mine, pre-kick-off, local only)
  me: null,                    // player id
  pin: null,                   // this device's four digits, sent with every write
  myName: null,
  isAdmin: false,
  loginName: null,             // name selected on the sign-in screen
  newPlayer: null,             // {name, pin} just created, held so a re-render keeps it on screen
  rosterCodes: null,           // admin's code list, same reason
  season: null,                // active season label
  seasonChosen: false,         // true once the user picks one by hand
  bulk: "",                    // raw text in the bulk box
  week: null,                  // matchweek on screen in Predict
  entry: null,                 // focused entry run: {i, picks:{fixtureId:pick}}
  resultsMd: null,             // matchday shown in Results
  statPlayer: null,            // drill-down in Stats
  identityOpen: false,
  saving: false
};

async function boot(){
  state.me = LS.get(K.me);
  state.pin = LS.get(K.pin);
  state.myName = LS.get(K.name);
  state.isAdmin = !!LS.get(K.admin);
  if(!state.pin) state.me = null;              // a device without a code isn't signed in
  state.pending = LS.json(K.pending, {});
  hydrateFromCache();
  render();
  await refresh(true);
}

function hydrateFromCache(){
  state.players  = LS.json(K.players, []);
  state.fixtures = LS.json(K.fixtures, []).map(f=>f).sort(byKickoff);
  state.picks    = new Map(LS.json(K.picks, []));
  state.history  = LS.json(K.history, []);
  state.myPicks  = LS.json(K.mine, {});
  refreshInitials();
  pickSeason();
}

function allSeasons(){
  const all = new Set(state.fixtures.map(f=>f.season));
  state.history.forEach(h=> all.add(h.season));
  return [...all].sort().reverse();
}
// A season with no results yet has nothing for the retrospective
// views, so defaulting to the newest one leaves the Table and Stats
// looking broken on the day a season starts. Default to the newest
// season that actually has something in it; the live season takes
// over by itself once its first results land.
function seasonsWithData(){
  const has = new Set(state.fixtures.filter(SETTLED).map(f=>f.season));
  state.history.forEach(h=> has.add(h.season));
  return [...has].sort().reverse();
}
function pickSeason(){
  const seasons = allSeasons();
  if(state.seasonChosen && (state.season === ALL_TIME || seasons.includes(state.season))) return;
  state.season = seasonsWithData().length ? ALL_TIME : (seasons[0] || null);
}

// Shown on every retrospective view once there's more than one season
// on file, which is the case as soon as the history is backfilled.
function seasonSeg(){
  const seasons = allSeasons();
  if(seasons.length < 2) return "";
  return `<div class="seg">
    <button class="btn sm ghost segbtn" data-season="${ALL_TIME}" aria-pressed="${allTime()}">All time</button>
    ${seasons.map(s=>
      `<button class="btn sm ghost segbtn" data-season="${esc(s)}" aria-pressed="${s===state.season}">${esc(s)}</button>`).join("")}
  </div>`;
}

async function refresh(quiet){
  $("#storeBadge").textContent = "Syncing…";
  try{
    const [players, fixtures, picks, history, own] = await Promise.all([
      SB.get("pl_players_public?select=id,name&order=name.asc"),
      SB.get("pl_fixtures?select=*&order=kickoff_utc.asc,id.asc"),
      SB.get("pl_picks_public?select=player_id,fixture_id,pick,revealed&order=fixture_id.asc,player_id.asc"),
      SB.get("pl_history?select=player_id,season,played_on,correct,matches,recovered,verified&order=season.asc,played_on.asc,player_id.asc").catch(()=>[]),
      // The public view hides every pick until kick-off, so our own
      // come back separately, unlocked by the code this device holds.
      (state.me && state.pin)
        ? SB.rpc("pl_my_picks", { p_player:state.me, p_pin:state.pin }).catch(()=>null)
        : null
    ]);
    state.players  = players;
    state.fixtures = fixtures.map(rowToFixture).sort(byKickoff);
    state.picks    = new Map(picks.map(p=>[pickKey(p.player_id,p.fixture_id), {pick:p.pick, revealed:p.revealed}]));
    state.history  = history || [];
    if(own) state.myPicks = Object.fromEntries(own.map(r => [r.fixture_id, r.pick]));
    pickSeason();
    refreshInitials();
    prunePending();
    LS.set(K.players,  JSON.stringify(state.players));
    LS.set(K.fixtures, JSON.stringify(state.fixtures));
    LS.set(K.picks,    JSON.stringify([...state.picks]));
    LS.set(K.history,  JSON.stringify(state.history));
    LS.set(K.mine,     JSON.stringify(state.myPicks));
    $("#storeBadge").textContent = "Live · " + (state.season || "no fixtures");
  }catch(e){
    console.warn("Refresh failed — using cache:", e);
    $("#storeBadge").textContent = "Offline · cached";
    if(!quiet) toast("Couldn't reach the database — showing the last copy.", true);
  }
  render();
}

// Once a pick has been served back to us there's no reason to keep
// the local copy, and a pick for a fixture that has since been
// cancelled is just clutter.
function prunePending(){
  const byId = new Map(state.fixtures.map(f=>[String(f.id), f]));
  let changed = false;
  Object.keys(state.pending).forEach(fid=>{
    const f = byId.get(String(fid));
    const served = state.me && state.picks.get(pickKey(state.me, fid));
    if(!f || VOID(f) || (served && served.pick)){ delete state.pending[fid]; changed = true; }
  });
  if(changed) LS.set(K.pending, JSON.stringify(state.pending));
}

/* ---------------------------------------------------------------
   5. ROUTER
   --------------------------------------------------------------- */
function render(){
  $$("#tabs button").forEach(b=> b.setAttribute("aria-selected", b.dataset.view===state.tab));
  renderWhoami();
  const app = $("#app");
  if(!state.me || state.identityOpen){ app.innerHTML = viewIdentity(); wireIdentity(); return; }
  if(state.tab==="predict" && state.entry){ app.innerHTML = viewEntry(); wireEntry(); return; }
  if(state.tab==="predict"){ app.innerHTML = viewPredict(); wirePredict(); return; }
  if(state.tab==="table")  { app.innerHTML = viewTable();   wireCommon(); return; }
  if(state.tab==="results"){ app.innerHTML = viewResults(); wireResults(); return; }
  app.innerHTML = viewStats(); wireStats();
}

function refreshInitials(){ INITIALS = initialsFor(state.players.map(p=>p.name)); }

function renderWhoami(){
  $("#whoami").innerHTML = `<button class="sync" id="syncBtn" title="Refresh" aria-label="Refresh">&#8635;</button>
    <button id="meBtn" title="${state.me?"Account":"Sign in"}">${
      esc(state.me ? (state.myName || "Account") : "Sign in")}</button>`;
  $("#meBtn").onclick = ()=>{ state.identityOpen = !state.identityOpen; render(); };
  $("#syncBtn").onclick = async (ev)=>{
    ev.currentTarget.classList.add("spin");
    await refresh(false);
    toast("Up to date.");
  };
}

/* ---------------------------------------------------------------
   6. IDENTITY
   A four-digit code per player, checked in the database. The code is
   held on the device and sent with every write, because knowing a
   player's id isn't enough — ids are visible in the picks view, so
   without the code anyone could write as anyone.
   --------------------------------------------------------------- */
function viewIdentity(){
  const chips = state.players.map(p=>
    `<button data-name="${esc(p.name)}" aria-pressed="${p.name===state.loginName}">${esc(p.name)}</button>`).join("");

  const admin = state.isAdmin ? `
    <h3 class="sect">Add a player</h3>
    <div class="sub">Their code is generated here and shown once. Send it to them.</div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="newName" maxlength="18" placeholder="Name" autocomplete="off" />
      <button class="btn sm" id="addPlayer" style="flex:0 0 auto">Create</button>
    </div>
    ${state.newPlayer ? `<div class="chart-card" style="text-align:center;margin-top:12px">
      <div class="ctitle">${esc(state.newPlayer.name)}</div>
      <div class="mono" style="font-size:34px;letter-spacing:.4em;color:var(--mark)">${esc(state.newPlayer.pin)}</div>
      <div class="sub" style="margin-bottom:10px">Send them this code. Show everyone&rsquo;s codes below if it gets lost.</div>
    </div>` : ""}
    <div class="row" style="margin-top:12px">
      <button class="btn ghost sm" id="showRoster">${state.rosterCodes ? "Hide codes" : "Show everyone's codes"}</button>
    </div>
    ${state.rosterCodes ? `<ul class="awards">${state.rosterCodes.map(r=>
      `<li><span>${esc(r.name)}</span><span class="pts">${esc(r.pin||"not set")}</span></li>`).join("")}</ul>` : ""}` : "";

  if(state.me){
    return `<section class="panel">
      <h2>Signed in</h2>
      <div class="sub">${esc(state.myName||"")}${state.isAdmin?" · admin":""} on this device.</div>
      <div class="row" style="margin-top:14px">
        <button class="btn ghost" id="closeId">Back</button>
        <button class="btn ghost" id="signOut">Sign out</button>
      </div>
      ${admin}
    </section>`;
  }

  return `<section class="panel">
    <h2>Sign in</h2>
    <div class="sub">Your name and your four-digit code.</div>
    <div class="namelist">${chips || '<span class="empty">Nobody on the books yet.</span>'}</div>
    <label class="fld" for="pinBox">Code</label>
    <input type="text" id="pinBox" inputmode="numeric" pattern="[0-9]*" maxlength="4"
      autocomplete="off" placeholder="&bull;&bull;&bull;&bull;"
      style="font-family:'Space Mono';font-size:24px;letter-spacing:.7em;text-align:center;text-indent:.7em" />
    <div class="row" style="margin-top:12px"><button class="btn" id="signIn" disabled>Sign in</button></div>
  </section>`;
}

function wireIdentity(){
  $$(".namelist button").forEach(b=> b.onclick = ()=>{
    state.loginName = b.dataset.name;
    $$(".namelist button").forEach(x=> x.setAttribute("aria-pressed", x===b));
    $("#pinBox")?.focus();
    refreshSignIn();
  });

  const pin = $("#pinBox");
  if(pin){
    pin.oninput = ()=>{ pin.value = pin.value.replace(/\D/g,"").slice(0,4); refreshSignIn(); };
    pin.onkeydown = e => { if(e.key==="Enter" && !$("#signIn").disabled) signIn(); };
    $("#signIn").onclick = signIn;
    if(state.loginName) pin.focus();
  }

  $("#closeId") && ($("#closeId").onclick = ()=>{
    state.identityOpen=false; state.newPlayer=null; state.rosterCodes=null; render();
  });
  $("#signOut") && ($("#signOut").onclick = ()=>{
    // Local only: the picks stay on the server, this device just forgets who it is.
    state.me = null; state.pin = null; state.myName = null; state.isAdmin = false;
    state.pending = {}; state.loginName = null; state.newPlayer = null; state.rosterCodes = null;
    [K.me, K.pin, K.name, K.admin, K.pending].forEach(k=> LS.del(k));
    render();
  });

  const add = $("#addPlayer");
  if(add){
    add.onclick = async ()=>{
      const name = ($("#newName").value||"").trim();
      if(!name) return;
      add.disabled = true;
      try{
        const rows = await SB.rpc("pl_create_player", { p_admin:state.me, p_admin_pin:state.pin, p_name:name });
        state.newPlayer = (rows||[])[0] || null;
        state.rosterCodes = null;
        await refresh(true);        // re-renders; newPlayer is in state so it survives
      }catch(e){
        console.warn(e);
        toast(rpcMessage(e) || "Couldn't create that player.", true);
      }
      add.disabled = false;
    };
    $("#newName").onkeydown = e => { if(e.key==="Enter") add.click(); };
  }

  $("#showRoster") && ($("#showRoster").onclick = async ()=>{
    if(state.rosterCodes){ state.rosterCodes = null; render(); return; }
    try{
      state.rosterCodes = await SB.rpc("pl_roster", { p_admin:state.me, p_admin_pin:state.pin }) || [];
      render();
    }catch(e){ toast(rpcMessage(e) || "Couldn't read the roster.", true); }
  });
}

function refreshSignIn(){
  const btn = $("#signIn"), pin = $("#pinBox");
  if(btn) btn.disabled = !(state.loginName && pin && pin.value.length === 4);
}

async function signIn(){
  const btn = $("#signIn");
  btn.disabled = true;
  const code = $("#pinBox").value;
  try{
    const rows = await SB.rpc("pl_login", { p_name:state.loginName, p_pin:code });
    const me = (rows||[])[0];
    if(!me){ toast("That code doesn't match.", true); $("#pinBox").value=""; refreshSignIn(); return; }
    state.me = me.id; state.pin = code; state.myName = me.name; state.isAdmin = !!me.is_admin;
    LS.set(K.me, me.id); LS.set(K.pin, code); LS.set(K.name, me.name);
    LS.set(K.admin, me.is_admin ? "1" : "");
    state.identityOpen = false;
    state.pending = {}; LS.del(K.pending);       // pending picks belong to whoever was here before
    render();
  }catch(e){
    console.warn("login failed:", e);
    toast("Couldn't reach the database.", true);
    refreshSignIn();
  }
}

// PostgREST wraps a RAISE in a JSON body; pull the message back out.
function rpcMessage(e){
  const m = String(e).match(/"message":"([^"]+)"/);
  return m ? m[1] : null;
}

/* ---------------------------------------------------------------
   7. PREDICT
   --------------------------------------------------------------- */
const FORTNIGHT = 14*24*3600*1000;

function openFixtures(){ return state.fixtures.filter(open); }

// Bulk strings map onto every open fixture in kick-off order, so a
// leading "_" skips the ones you've already called — exactly how the
// group has always written them in the chat.
function parseBulk(text){
  const out = [];
  for(const ch of (text||"").toUpperCase()){
    if(/\s/.test(ch)) continue;
    if(ch==="_"||ch==="-"||ch==="."||ch==="*"){ out.push(null); continue; }
    if(PICKS.includes(ch)){ out.push(ch); continue; }
    out.push("!");                       // anything else is a typo, flagged below
  }
  return out;
}

// Matchweeks that still have something to call, earliest first.
function openWeeks(){
  return [...new Set(openFixtures().map(f=>f.matchday))].sort((a,b)=>a-b);
}
// The week on screen. Defaults to the earliest with anything open, and
// follows the season along unless you've paged somewhere by hand.
function currentWeek(){
  const weeks = openWeeks();
  if(!weeks.length) return null;
  return weeks.includes(state.week) ? state.week : weeks[0];
}
// The bulk box maps onto the week you're looking at, so a string is
// read against the fixtures in front of you rather than the whole
// remaining season.
function weekFixtures(){
  const w = currentWeek();
  return w == null ? [] : openFixtures().filter(f=> f.matchday === w);
}

function viewPredict(){
  const all = openFixtures();
  if(!all.length){
    return `<section class="panel"><h2>Predict</h2>
      <div class="empty">${state.fixtures.length ? "Nothing to call." : "No fixtures loaded yet."}</div>
      ${dataState()}${refreshRow()}</section>`;
  }

  const weeks = openWeeks();
  const week  = currentWeek();
  const at    = weeks.indexOf(week);
  const list  = weekFixtures();
  const mine  = list.filter(f=>myPick(f.id)).length;

  const groups = [];
  let last = null;
  list.forEach(f=>{
    const k = dayKey(f.kickoff);
    if(k !== last){ groups.push({key:k, iso:f.kickoff, items:[]}); last = k; }
    groups[groups.length-1].items.push(f);
  });

  const body = groups.map(g=>`
    <div class="daybar"><h3>${esc(fmtDay(g.iso))}</h3></div>
    ${g.items.map(f=> fixtureRow(f, list.indexOf(f))).join("")}
  `).join("");

  return `<section class="panel">
    <h2>Predict</h2>

    <div class="weekbar">
      <button class="wknav" id="wkPrev" ${at<=0?"disabled":""} aria-label="Previous matchweek">&lsaquo;</button>
      <div class="wklabel">
        <b>Matchweek ${week}</b>
        <span>${mine} of ${list.length} called${weeks.length>1?` · ${weeks.length-at-1} week${weeks.length-at-1===1?"":"s"} ahead`:""}</span>
      </div>
      <button class="wknav" id="wkNext" ${at>=weeks.length-1?"disabled":""} aria-label="Next matchweek">&rsaquo;</button>
    </div>

    ${nudgeBanner()}

    <div class="row" style="margin-top:12px">
      <button class="btn" id="startEntry">${mine ? "Carry on predicting" : "Start predicting"}</button>
    </div>

    <details class="paste" ${state.bulk ? "open" : ""}>
      <summary>or paste a string</summary>
      <div class="bulk">
        <input type="text" id="bulkBox" value="${esc(state.bulk)}" placeholder="HDHHA"
          autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="60" />
        <div class="hint" id="bulkHint"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost sm" id="bulkClear" style="flex:1">Clear</button>
          <button class="btn sm" id="bulkApply" style="flex:2" disabled>Apply</button>
        </div>
      </div>
    </details>

    <div style="margin-top:6px">${body}</div>
    ${list.some(moved) ? `<div class="sub" style="margin-top:10px">&dagger; kick-off moved since the fixture was first published.</div>` : ""}
    ${othersKey()}
    ${saveRow()}
    ${refreshRow()}
  </section>`;
}

/* One fixture filling the screen, three buttons naming the actual
   teams, and h/d/a on a keyboard. The bulk box works well when you're
   pasting a string you already have, and badly when you're composing
   one — the list scrolls under the caret and the row you're on isn't
   the row you're looking at. This is the other half of that.

   Picks are held locally and written in one call at the end, so a
   ten-match week is one round trip rather than ten. */
function entryFixtures(){ return weekFixtures(); }

function startEntry(){
  const list = entryFixtures();
  if(!list.length) return;
  const firstOpen = list.findIndex(f => !myPick(f.id));
  state.entry = { i: firstOpen < 0 ? 0 : firstOpen, picks: {} };
  render();
}

function viewEntry(){
  const list = entryFixtures();
  const e = state.entry;
  const chosen = id => e.picks[id] || (myPick(id) === "?" ? null : myPick(id));
  const doneCount = list.filter(f => chosen(f.id)).length;

  if(e.i >= list.length){
    const pending = Object.keys(e.picks).length;
    return `<div class="entry">
      <div class="ehead"><span class="etitle">Matchweek ${currentWeek()}</span>
        <button class="eclose" id="eClose">Close</button></div>
      <div class="ebody">
        <div class="edone">

function wireEntry(){
  const list = entryFixtures();
  const e = state.entry;
  const pick = (k)=>{
    const f = list[e.i];
    if(!f) return;
    e.picks[f.id] = k;
    e.i++;
    render();
  };
  $$(".ebtn").forEach(b=> b.onclick = ()=> pick(b.dataset.pick));
  $("#ePrev") && ($("#ePrev").onclick = ()=>{ if(e.i>0){ e.i--; render(); } });
  $("#eSkip") && ($("#eSkip").onclick = ()=>{ e.i++; render(); });
  $("#eBack") && ($("#eBack").onclick = ()=>{ e.i = Math.max(0, list.length-1); render(); });
  const close = async ()=>{ await flushEntry(); state.entry = null; render(); };
  $("#eClose")  && ($("#eClose").onclick  = close);
  $("#eClose2") && ($("#eClose2").onclick = close);
  $("#eSave")   && ($("#eSave").onclick   = close);

  document.onkeydown = (ev)=>{
    if(!state.entry) return;
    const k = ev.key.toUpperCase();
    if("HDA".includes(k) && k.length===1){ ev.preventDefault(); pick(k); }
    else if(ev.key==="ArrowLeft" || ev.key==="Backspace"){ ev.preventDefault(); if(e.i>0){ e.i--; render(); } }
    else if(ev.key==="ArrowRight"){ ev.preventDefault(); e.i++; render(); }
    else if(ev.key==="Escape"){ ev.preventDefault(); close(); }
  };
}

// One write for the whole run.
async function flushEntry(){
  document.onkeydown = null;
  const e = state.entry;
  if(!e) return;
  const rows = Object.entries(e.picks)
    .map(([id, pick]) => ({ fixture: state.fixtures.find(f => String(f.id) === String(id)), pick }))
    .filter(r => r.fixture);
  if(!rows.length) return;
  const ok = await sendPicks(rows);
  if(ok) toast(`${rows.length} prediction${rows.length===1?"":"s"} in.`);
}

  const future = fx.filter(f=> !kicked(f));

    Latest kick-off stored: ${esc(fmtDay(last.kickoff))} ${esc(fmtTime(last.kickoff))}.<br>

   legend — every initial rendered once filled and once outlined to

/* Within 12 hours of a kick-off, anyone still missing a call for it
   gets named to everyone. Chasing people is the one job the group
   chat was actually doing, so the app should do it instead. */
const NUDGE_H = 12;
function nudgeBanner(){
  const soon = openFixtures().filter(f =>
    new Date(f.kickoff).getTime() - Date.now() < NUDGE_H * 3600e3);
  if(!soon.length) return "";

  const behind = state.players.filter(p =>
    soon.some(f => !hasPicked(p.id, f.id)));
  if(!behind.length) return "";

  const first = soon.reduce((a,b)=> new Date(a.kickoff) < new Date(b.kickoff) ? a : b);
  const mins  = Math.max(0, Math.round((new Date(first.kickoff) - Date.now()) / 60000));
  const when  = mins < 90 ? `${mins} min` : `${Math.round(mins/60)} hours`;
  const mineToo = behind.some(p => p.id === state.me);
  const others  = behind.filter(p => p.id !== state.me).map(p => p.name);
  const list    = others.length === 1 ? others[0]
                : others.slice(0,-1).join(", ") + " and " + others[others.length-1];

  const parts = [];
  if(mineToo) parts.push("You haven't called it yet.");
  if(others.length) parts.push(`Remind ${esc(list)} to do ${others.length === 1 ? "theirs" : "theirs"}.`);

  return `<div class="nudge">
    <b>${esc(first.homeShort)} v ${esc(first.awayShort)} kicks off in ${when}.</b>
    ${parts.join(" ")}
  </div>`;
}

// Paints the parsed string onto the fixture rows without re-rendering,
// so the input keeps focus and the caret while you type.
function paintBulk(){
  const letters = parseBulk(state.bulk);
  const all = weekFixtures();
  $$(".pk").forEach(b=> b.classList.remove("preview"));
  let applied = 0, bad = 0;
  letters.forEach((ch, i)=>{
    if(ch === "!"){ bad++; return; }
    if(ch === null || i >= all.length) return;
    const f = all[i];
    const btn = $(`.pk[data-fx="${f.id}"][data-pick="${ch}"]`);
    if(btn && btn.getAttribute("aria-pressed") !== "true"){ btn.classList.add("preview"); }
    applied++;
  });
  const over = Math.max(0, letters.length - all.length);
  const hint = $("#bulkHint"), apply = $("#bulkApply");
  if(!letters.length){
    hint.innerHTML = `One letter per fixture in this week, in the order below. <b class="tally">_</b> skips one.`;
    apply.disabled = true;
  }else if(bad){
    hint.innerHTML = `<span class="bad">Only H, A, D and _ please — ${bad} character${bad===1?"":"s"} won't map.</span>`;
    apply.disabled = true;
  }else if(over){
    hint.innerHTML = `<span class="bad">${letters.length} letters but only ${all.length} still to call this week — ${over} too many.</span>`;
    apply.disabled = true;
  }else{
    const offscreen = letters.length - $$(".fx").length;
    hint.innerHTML = `<span class="tally">${applied}</span> pick${applied===1?"":"s"} across the next <span class="tally">${letters.length}</span> fixture${letters.length===1?"":"s"}.`
      + (offscreen > 0 ? ` <span class="bad">${offscreen} beyond the list below.</span>` : "");
    apply.disabled = applied === 0;
  }
  const first = $(".pk.preview");
  if(first) first.closest(".fx")?.scrollIntoView({block:"nearest"});
}

async function applyBulk(){
  const letters = parseBulk(state.bulk);
  const all = weekFixtures();
  const rows = [];
  letters.forEach((ch,i)=>{ if(ch && ch!=="!" && i<all.length) rows.push({fixture:all[i], pick:ch}); });
  if(!rows.length) return;
  $("#bulkApply").disabled = true;
  const ok = await sendPicks(rows);
  if(ok){ state.bulk = ""; toast(`${rows.length} prediction${rows.length===1?"":"s"} in.`); }
  render();
}

async function savePick(fixtureId, pick){
  const f = state.fixtures.find(x=>String(x.id)===String(fixtureId));
  if(!f) return;
  if(myPick(f.id) === pick) return;                 // tapping the same pick is a no-op, not a toggle-off
  await sendPicks([{fixture:f, pick}]);
  render();
}

// One upsert for the batch. The database re-checks kick-off on every
// row, so a fixture that started while the page was open is rejected
// there rather than trusted from here.
async function sendPicks(rows){
  if(!state.me || !state.pin) { state.identityOpen = true; render(); return false; }
  const live = rows.filter(r=> open(r.fixture));
  if(live.length < rows.length) toast("Some of those have kicked off — skipped.", true);
  if(!live.length) return false;
  live.forEach(r=>{ state.pending[r.fixture.id] = r.pick; state.myPicks[r.fixture.id] = r.pick; });
  LS.set(K.pending, JSON.stringify(state.pending));
  try{
    const verdicts = await SB.rpc("pl_predict_batch", {
      p_player: state.me, p_pin: state.pin,
      p_picks: live.map(r=>({ fixture_id: r.fixture.id, pick: r.pick }))
    }) || [];
    const refused = verdicts.filter(v=> !v.ok);
    verdicts.filter(v=> v.ok).forEach(v=>
      state.picks.set(pickKey(state.me, v.fid), {pick:null, revealed:false}));
    refused.forEach(v=> delete state.pending[v.fid]);
    LS.set(K.pending, JSON.stringify(state.pending));
    LS.set(K.picks, JSON.stringify([...state.picks]));
    if(refused.length){
      const f = state.fixtures.find(x=> String(x.id)===String(refused[0].fid));
      toast(refused.length === 1 && f
        ? `${f.homeShort} v ${f.awayShort}: ${refused[0].why}.`
        : `${refused.length} refused — ${refused[0].why}.`, true);
    }
    return refused.length < live.length;
  }catch(e){
    console.warn("sendPicks failed:", e);
    live.forEach(r=> delete state.pending[r.fixture.id]);
    LS.set(K.pending, JSON.stringify(state.pending));
    if(String(e).includes("P0003")){
      state.identityOpen = true;                 // code no longer valid — sign in again
      toast("Your code was rejected. Sign in again.", true);
    }else{
      toast(String(e).includes("PGRST202")
        ? "The database is missing pl_predict_batch — run add-logins.sql."
        : "Couldn't save: " + (rpcMessage(e) || String(e).replace(/^Error:s*/, "")).slice(0, 120), true);
    }
    return false;
  }
}

/* ---------------------------------------------------------------
   8. SCORING
   --------------------------------------------------------------- */
const ALL_TIME = "*";
const allTime = () => state.season === ALL_TIME;
function seasonFixtures(){
  return allTime() ? state.fixtures : state.fixtures.filter(f=> !state.season || f.season===state.season);
}
function settledFixtures(){ return seasonFixtures().filter(SETTLED); }

/* The group kept a spreadsheet from 2020 onward and it is correct. The
   picks rebuilt from the chat exports are about 93% complete, so the
   two are used for different things and never mixed:

     pl_history is the authority on SCORES. Points, standings, totals.

     pl_predictions is the authority on PICKS, but only on days flagged
     verified — where the reconstruction recovered every fixture and
     independently arrived at the sheet's own number. Everywhere else
     it has holes, and a hole in "how often do you call a draw" is a
     wrong answer rather than a missing one.

   For the live season there's no spreadsheet, the app recorded every
   pick itself, and both tiers are the same thing. */
function historyFor(season){
  return season === ALL_TIME ? state.history : state.history.filter(h => h.season === season);
}
function verifiedDaysFor(season){
  const set = new Set();
  historyFor(season).forEach(h => { if(h.verified) set.add(h.player_id + "|" + h.played_on); });
  return set;
}
// Seasons the spreadsheet covers. Anything outside them — the live one
// — is scored from the app's own record instead, which is complete.
function seasonsWithHistory(){ return new Set(state.history.map(h => h.season)); }
const dayOf = f => new Date(f.kickoff).toISOString().slice(0,10);

// Every derived number in the app comes off this one pass, so the
// Table, Results and Stats views can never disagree with each other.
function computeSeason(){
  const fixtures = settledFixtures();
  const hist = historyFor(state.season);
  const verified = verifiedDaysFor(state.season);
  const hasHistory = hist.length > 0;
  // All-time spans both worlds: the spreadsheet covers the finished
  // seasons, the app's own record covers the live one. Which applies
  // is a property of the fixture's season, not of the view.
  const histSeasons = seasonsWithHistory();
  const players = state.players.map(p=>({
    id:p.id, name:p.name,
    played:0, correct:0, missed:0, untrusted:0,
    points:0, scored:0, dayWins:0, hasTruth:false,
    livePoints:0, liveScored:0,
    byPick:{H:{n:0,ok:0},A:{n:0,ok:0},D:{n:0,ok:0}},
    bestStreak:0, curStreak:0, _run:0,
    solo:0, blind:0, withHerd:0, herdN:0,
    byMd:{}, teams:{}, series:[], form:[],
    firstAt:null
  }));
  const byId = new Map(players.map(p=>[p.id,p]));

  // Where each player joined in, so a late arrival isn't billed for
  // fixtures that were settled before they existed.
  state.picks.forEach((v,k)=>{
    const [pid,fid] = k.split("|");
    const p = byId.get(pid); const f = state.fixtures.find(x=>String(x.id)===fid);
    if(!p || !f) return;
    const t = new Date(f.kickoff).getTime();
    if(p.firstAt===null || t < p.firstAt) p.firstAt = t;
  });

  let seriesLabels = null;
  const actual = {H:0,A:0,D:0};
  const drama = [];        // per-fixture, for the banana-skin awards
  const md = new Set();

  fixtures.forEach(f=>{
    actual[f.result]++;
    const ko = new Date(f.kickoff).getTime();
    const day = dayOf(f);
    const fromSheet = histSeasons.has(f.season);
    const trusts = p => !fromSheet || verified.has(p.id + "|" + day);

    const calls = players.map(p=>({p, pick: revealedPick(p.id, f.id)})).filter(x=>x.pick);
    // Comparing yourself to the room only means anything when the whole
    // room is known. With a ~93% reconstruction, most fixtures are
    // missing somebody, and counting those would measure who happened
    // to be recovered rather than who was actually alone.
    const room = calls.filter(c => trusts(c.p));
    const fullRoom = room.length === players.length;
    const tally = {H:0,A:0,D:0}; room.forEach(c=> tally[c.pick]++);
    const top = Math.max(tally.H, tally.A, tally.D);
    const modal = PICKS.filter(x=>tally[x]===top);
    const rightCount = room.filter(c=>c.pick===f.result).length;
    md.add(f.matchday);
    players.forEach(p=>{
      const call = calls.find(c=>c.p===p);
      // Where the spreadsheet covers the season, only days proven
      // against it may inform how someone predicts. Where it doesn't,
      // the app recorded every pick itself and all of them count.
      const trust = trusts(p);
      if(!call){
        if(!fromSheet && p.firstAt !== null && ko >= p.firstAt) p.missed++;
        if(!fromSheet) p.liveScored++;
        return;
      }
      if(!fromSheet){ p.liveScored++; if(call.pick === f.result) p.livePoints++; }
      if(!trust){ p.untrusted++; return; }
      const hit = call.pick === f.result;
      p.played++;
      p.byPick[call.pick].n++;
      if(hit){ p.byPick[call.pick].ok++; p.correct++; p._run++; p.bestStreak = Math.max(p.bestStreak, p._run); }
      else p._run = 0;
      p.form.push(hit);
      if(fullRoom){
        if(hit && rightCount===1) p.solo++;
        if(!hit && rightCount===room.length-1) p.blind++;
        p.herdN++; if(modal.includes(call.pick)) p.withHerd++;
      }

      const m = p.byMd[f.matchday] || (p.byMd[f.matchday] = {n:0, ok:0});
      m.n++; if(hit) m.ok++;
      [f.homeShort, f.awayShort].forEach(t=>{
        const tr = p.teams[t] || (p.teams[t] = {n:0, ok:0});
        tr.n++; if(hit) tr.ok++;
      });
    });

    if(fullRoom && room.length >= 2) drama.push({fixture:f, calls:room, right:rightCount});
  });

  players.forEach(p=>{
    p.curStreak = p._run;
    p.form = p.form.slice(-6);
    // Points are the spreadsheet's where it covers the season, and the
    // app's own record where it doesn't. Adding the two is the only way
    // an all-time total is both complete and exact.
    const mine = hist.filter(x => x.player_id === p.id);
    p.hasTruth = mine.length > 0;
    p.points = mine.reduce((n,x)=> n + x.correct, 0) + p.livePoints;
    p.scored = mine.reduce((n,x)=> n + x.matches, 0) + p.liveScored;
    p.verifiedDays = mine.filter(x=>x.verified).length;
    p.totalDays = mine.length;
    p.recoveredPicks = mine.reduce((n,x)=> n + x.recovered, 0) + (p.hasTruth ? 0 : p.played);
    p.acc = pct(p.points, p.scored);          // strike rate over everything that was playable
    p.pickAcc = pct(p.correct, p.played);     // strike rate over the picks we can actually see
  });

  // Day wins, from the spreadsheet where there is one — it knows about
  // days the reconstruction never recovered.
  if(hasHistory){
    const byDay = {};
    hist.forEach(x => (byDay[x.played_on] = byDay[x.played_on] || []).push(x));
    Object.values(byDay).forEach(day => {
      if(day.length < 2) return;
      const top = Math.max(...day.map(x=>x.correct));
      if(top === 0) return;
      const winners = day.filter(x=>x.correct === top);
      if(winners.length === 1) byId.get(winners[0].player_id) && byId.get(winners[0].player_id).dayWins++;
    });
  }

  // Cumulative points — the shape of the season. Drawn from the same
  // anchor as the table: the spreadsheet where there is one, the app's
  // own record otherwise. Drawing it off the partial reconstruction
  // would put a second, quieter set of totals on the same page.
  let mds = [...md].sort((a,b)=>a-b);
  if(hasHistory){
    const days = [...new Set(hist.map(x=>x.played_on))].sort();
    const byPlayerDay = {};
    hist.forEach(x => byPlayerDay[x.player_id + "|" + x.played_on] = x.correct);
    players.forEach(p=>{
      let run = 0;
      p.series = days.map(d => { run += (byPlayerDay[p.id + "|" + d] || 0); return run; });
    });
    mds = days.map((_,i)=> i + 1);
    seriesLabels = [days[0], days[days.length-1]];
  }else{
    players.forEach(p=>{
      let run = 0;
      p.series = mds.map(m=>{ run += (p.byMd[m]?.ok || 0); return run; });
    });
  }

  // Two baselines worth beating: always calling the home side, and
  // always calling whatever the group's majority called.
  let homeAlways = 0;
  fixtures.forEach(f=>{ if(f.result==="H") homeAlways++; });

  players.sort((a,b)=> b.points-a.points || b.acc-a.acc || a.name.localeCompare(b.name));
  const anyTruth = players.some(p=>p.hasTruth);
  return { players, fixtures, mds, actual, drama, homeAlways, hasHistory:anyTruth, seriesLabels,
           fixtureCount: fixtures.length,
           total: anyTruth ? Math.max(...players.map(p=>p.scored)) : fixtures.length };
}

// Matchday winners: outright if alone on top, shared otherwise. Only
// counted where everyone in contention actually had picks in.
function matchdayWinners(season){
  const out = {};
  season.mds.forEach(m=>{
    const scores = season.players
      .filter(p=> (p.byMd[m]?.n || 0) > 0)
      .map(p=>({p, ok:p.byMd[m].ok}));
    if(scores.length < 2) return;
    const top = Math.max(...scores.map(s=>s.ok));
    const win = scores.filter(s=>s.ok===top);
    out[m] = { top, winners: win.map(s=>s.p) };
  });
  return out;
}

/* ---------------------------------------------------------------
   9. TABLE
   --------------------------------------------------------------- */
function viewTable(){
  const s = computeSeason();
  if(!s.fixtureCount && !s.hasHistory){
    return `<section class="panel"><h2>Table</h2>
      <div class="sub">Nothing settled in ${esc(state.season||"this season")} yet.</div>
      ${seasonSeg()}
      <div class="empty">The table fills in as results land.</div>${refreshRow()}</section>`;
  }
  const wins = matchdayWinners(s);
  const mdWins = {};
  Object.values(wins).forEach(w=> w.winners.forEach(p=> mdWins[p.id] = (mdWins[p.id]||0) + (w.winners.length===1?1:0)));

  const rows = s.players.map((p,i)=>{
    const form = p.form.map(ok=>`<i class="${ok?"ok":"no"}"></i>`).join("");
    const streak = !s.hasHistory && p.curStreak >= 3 ? ` <span class="streak" title="correct in a row">+${p.curStreak}</span>` : "";
    const dayw = s.hasHistory ? p.dayWins : (mdWins[p.id]||0);
    return `<tr class="${p.id===state.me?"me":""}">
      <td class="num">${i+1}</td>
      <td>${esc(p.name)}${streak}</td>
      <td class="num">${p.scored}</td>
      <td class="num" style="color:var(--mark);font-weight:700">${p.points}</td>
      <td class="num">${p.acc}%</td>
      <td class="num">${dayw}</td>
      <td>${s.hasHistory ? coverageBar(p) : `<div class="form">${form}</div>`}</td>
    </tr>`;
  }).join("");

  const leader = s.players[0];
  const chase = s.players[1];
  const gap = leader && chase ? leader.points - chase.points : 0;

  const chart = cumulativeChart(s);
  // Would you have done better just backing the home side every week?
  const beat = s.players.filter(p=> p.points > Math.round(s.homeAlways * (p.scored / (s.fixtureCount||1)))).length;

  return `<section class="panel">
    <h2>Table</h2>
    <div class="sub">${allTime() ? "All time · " : ""}${s.hasHistory ? `${s.total} matches scored` : `${s.fixtureCount} match${s.fixtureCount===1?"":"es"} settled`}</div>
    ${seasonSeg()}
    <div class="keys" style="margin-top:14px">
      <div class="key"><div class="big">${leader ? leader.points : 0}</div><div class="lbl">Top score · ${esc(leader?.name||"")}</div></div>
      <div class="key"><div class="big">${gap}</div><div class="lbl">Lead over ${esc(chase?.name||"the pack")}</div></div>
      <div class="key"><div class="big">${pct(s.actual.H, s.fixtureCount)}%</div><div class="lbl">Home wins${allTime()?" all time":" this season"}</div></div>
      <div class="key"><div class="big">${beat}/${s.players.length}</div><div class="lbl">Beating "always home"</div></div>
    </div>
    <div class="scroller" style="margin-top:8px">
      <table class="grid">
        <thead><tr><th class="num">#</th><th>Player</th><th class="num">P</th><th class="num">Pts</th>
          <th class="num">Acc</th><th class="num">${s.hasHistory?"D":"MD"}</th><th>${s.hasHistory?"Coverage":"Form"}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="sub" style="margin-top:8px">${s.hasHistory
      ? "P matches · Pts correct calls, from the group's spreadsheet · D outright day wins · coverage is how much of the season's picks survived in the chat history."
      : "P played · Pts correct calls · MD outright matchday wins · form runs oldest to newest."}</div>
    ${chart}
    ${refreshRow()}
  </section>`;
}
