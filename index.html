<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Premier League Predictions</title>
<meta name="description" content="H, A or D before kick-off. Predictions, results and a season's worth of arguing, for a group of friends." />
<meta name="theme-color" content="#0a1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Predictions" />
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Premier%20League%20Predictions%22%2C%22short_name%22%3A%22Predictions%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a1020%22%2C%22theme_color%22%3A%22%230a1020%22%2C%22start_url%22%3A%22.%22%7D" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     THEME — Results page
     A football results page, not a dashboard: flat surfaces,
     hairline rules, condensed caps for headers, monospace for every
     figure so columns line up. One accent colour, used sparingly.
       --ink    #0b0d10  page
       --paper  #101318  panel
       --chalk  #e4e7ea  primary text
       --ash    #79818c  secondary text
       --rule   #22272e  hairlines
       --mark   #d9a536  the one accent
       --ok     #4c9e69  correct call
       --no     #a5424e  wrong call
     ============================================================ */
  :root{
    --ink:#0b0d10; --paper:#101318; --raise:#161a20;
    --chalk:#e4e7ea; --ash:#79818c; --rule:#22272e;
    --mark:#d9a536; --ok:#4c9e69; --no:#a5424e; --cool:#5b8cb8;
    --r:5px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:15.5px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,h4{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.05em;margin:0}
  .mono{font-family:"Space Mono",ui-monospace,monospace}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  a{color:var(--mark)}

  .wrap{max-width:800px;margin:0 auto;padding:0 14px 56px}

  /* ---------- Masthead ---------- */
  header.top{display:flex;align-items:flex-end;gap:12px;padding:18px 0 10px;border-bottom:2px solid var(--chalk)}
  header.top h1{font-size:27px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
  header.top .sub{color:var(--ash);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:3px}
  .whoami{margin-left:auto}
  .whoami button{background:transparent;border:1px solid var(--rule);color:var(--chalk);
    border-radius:var(--r);padding:6px 11px;font-size:13px;font-weight:500}
  .whoami button:hover{border-color:var(--ash)}

  /* ---------- Tabs ---------- */
  nav.tabs{display:flex;gap:0;margin:0 0 18px;border-bottom:1px solid var(--rule)}
  nav.tabs button{
    flex:1 1 auto;background:transparent;border:none;border-bottom:2px solid transparent;
    color:var(--ash);padding:11px 6px;font-size:11.5px;letter-spacing:.16em;
    text-transform:uppercase;font-family:"Barlow Condensed";font-weight:600;transition:.15s;
  }
  nav.tabs button:hover{color:var(--chalk)}
  nav.tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--mark)}

  /* ---------- Panels ---------- */
  .panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
    padding:16px;margin-bottom:14px}
  .panel h2{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk)}
  .panel .sub{color:var(--ash);font-size:13px;margin-top:2px}
  h3.sect{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);
    margin:22px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--rule)}

  label.fld{display:block;margin:14px 0 6px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
  input[type=text],select{
    width:100%;background:var(--ink);border:1px solid var(--rule);color:var(--chalk);
    border-radius:var(--r);padding:11px 13px;font-size:16px;outline:none;
  }
  input:focus,select:focus{border-color:var(--mark)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--chalk);color:var(--ink);border:1px solid var(--chalk);border-radius:var(--r);
    padding:11px 16px;font-size:12.5px;font-weight:700;letter-spacing:.1em;
    font-family:"Barlow Condensed";text-transform:uppercase;width:100%;transition:.13s}
  .btn:hover{background:#fff;border-color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.3;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ash);border-color:var(--rule)}
  .btn.ghost:hover{background:transparent;color:var(--chalk);border-color:var(--ash)}
  .btn.sm{padding:7px 12px;font-size:11.5px;width:auto}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > *{flex:1}

  /* ---------- Bulk entry ---------- */
  .bulk{border:1px solid var(--rule);border-radius:var(--r);padding:12px;background:var(--ink)}
  .bulk input{font-family:"Space Mono";font-size:21px;letter-spacing:.4em;text-transform:uppercase;
    text-align:center;text-indent:.4em;background:transparent;border-color:var(--rule)}
  .bulk .hint{color:var(--ash);font-size:12px;margin-top:8px;text-align:center;min-height:1.4em}
  .bulk .tally{font-family:"Space Mono";color:var(--mark)}
  .bulk .bad{color:var(--no);font-weight:500}

  /* ---------- Fixture rows ---------- */
  .daybar{display:flex;align-items:baseline;gap:9px;margin:18px 0 0;padding-bottom:4px;
    border-bottom:1px solid var(--rule)}
  .daybar h3{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk)}
  .daybar .md{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);margin-left:auto}

  .fx{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--rule)}
  .fx:last-child{border-bottom:none}
  .fx .ko{font-family:"Space Mono";font-size:12px;color:var(--ash);text-align:right;line-height:1.3}
  .fx .ko.moved{color:var(--mark)}
  .fx .teams{min-width:0;font-size:14px;line-height:1.34}
  .fx .teams .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx .teams .note{font-size:11px;color:var(--ash)}
  .fx.locked .teams{color:var(--ash)}

  .picks{display:flex;gap:4px}
  .pk{width:36px;height:34px;border-radius:var(--r);border:1px solid var(--rule);background:transparent;
    color:var(--ash);font-family:"Space Mono";font-weight:700;font-size:13px;transition:.12s;padding:0}
  .pk:hover{color:var(--chalk);border-color:var(--ash)}
  .pk[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
  .pk.preview{border-color:var(--mark);color:var(--mark);border-style:dashed}
  .pk[disabled]{opacity:.4;cursor:not-allowed}

  .whodunnit{display:flex;gap:3px;margin-top:4px}
  .whodunnit span{width:13px;height:2px;background:#333a44}
  .whodunnit span.in{background:var(--ok)}

  /* ---------- Tables ---------- */
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.grid{border-collapse:collapse;width:100%;font-size:13px}
  table.grid th,table.grid td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
  table.grid thead th{border-bottom:1px solid var(--ash)}
  table.grid th{font-family:"Barlow Condensed";font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ash);font-weight:600}
  table.grid td.num,table.grid th.num{font-family:"Space Mono";text-align:right}
  table.grid tbody tr:hover td{background:rgba(255,255,255,.02)}
  table.grid tr.me td:first-child{box-shadow:inset 2px 0 0 var(--mark)}
  table.grid tr.me td{background:rgba(217,165,54,.05)}
  table.grid td.cell,table.grid th.cell{text-align:center;font-family:"Space Mono";font-weight:700;width:36px;padding:6px 4px}
  table.grid tr.totals td{border-bottom:none;border-top:1px solid var(--ash);font-weight:700}
  .cell .b{display:inline-grid;place-items:center;width:24px;height:22px;border-radius:3px;
    background:transparent;border:1px solid var(--rule);color:var(--ash);font-size:12px}
  .cell .b.ok{background:var(--ok);border-color:var(--ok);color:#06180d}
  .cell .b.no{background:transparent;border-color:var(--no);color:var(--no)}
  .cell .b.none{border-color:transparent;color:var(--rule)}
  .res{font-family:"Space Mono";font-weight:700;text-align:center}

  .form{display:flex;gap:2px}
  .form i{width:8px;height:12px;background:var(--rule);display:block}
  .form i.ok{background:var(--ok)}
  .form i.no{background:var(--no);opacity:.5}
  .streak{font-family:"Space Mono";font-size:11px;color:var(--mark)}

  /* ---------- Key figures ---------- */
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));
    border-top:1px solid var(--rule);margin:14px 0 4px}
  .key{padding:11px 12px 11px 0;border-bottom:1px solid var(--rule)}
  .key .big{font-family:"Space Mono";font-size:20px;color:var(--chalk);line-height:1.2}
  .key .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin-top:3px;line-height:1.45}

  /* ---------- Awards ---------- */
  .awards{list-style:none;padding:0;margin:6px 0 0}
  .awards li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
    padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .awards li:last-child{border-bottom:none}
  .awards li .pts{font-family:"Space Mono";font-size:13px;color:var(--mark);text-align:right;white-space:nowrap}
  .awards li .aw{color:var(--ash);font-size:12px;display:block;margin-top:1px}

  .chart-card{border:1px solid var(--rule);border-radius:var(--r);padding:12px 12px 4px;margin:12px 0}
  .chart-card .ctitle{font-family:"Barlow Condensed";font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ash);margin-bottom:8px}
  .chart-card svg{display:block;width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 8px;font-size:11px;color:var(--ash)}
  .legend b{display:inline-block;width:8px;height:8px;margin-right:5px}

  .seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .seg .segbtn{flex:0 0 auto}
  .seg .segbtn[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
  .empty{color:var(--ash);text-align:center;padding:26px 0;font-size:14px}
  .tag{display:inline-block;font-family:"Space Mono";font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;border:1px solid var(--rule);border-radius:3px;padding:1px 5px;color:var(--ash)}
  .tag.live{border-color:var(--mark);color:var(--mark)}
  .foot{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
    color:var(--ash);font-size:11.5px;margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
  .foot .tag{border:none;padding:0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;
    background:var(--chalk);color:var(--ink);font-weight:600;font-size:13.5px;
    padding:10px 16px;border-radius:var(--r);max-width:88vw;text-align:center}
  .toast.bad{background:var(--no);color:#fff}
  .namelist{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
  .namelist button{background:transparent;border:1px solid var(--rule);color:var(--chalk);
    border-radius:var(--r);padding:9px 15px;font-size:15px;font-weight:500}
  .namelist button:hover{border-color:var(--ash)}
  .namelist button[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}

  @media (max-width:400px){
    .fx{grid-template-columns:38px 1fr auto;gap:8px}
    .pk{width:33px;height:32px}
    header.top h1{font-size:23px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
  :focus-visible{outline:1px solid var(--mark);outline-offset:2px}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="sub">Premier League</div>
      <h1>Predictions</h1>
    </div>
    <div class="whoami" id="whoami"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="predict" aria-selected="true">Predict</button>
    <button data-view="table">Table</button>
    <button data-view="results">Results</button>
    <button data-view="stats">Stats</button>
  </nav>

  <main id="app"></main>

  <div class="foot">
    <span class="tag" id="storeBadge">&hellip;</span>
    <span id="syncBadge"></span>
  </div>
</div>

<script>
/* ================================================================
   PREMIER LEAGUE PREDICTIONS
   Single-file, host-anywhere. No build step, no framework.

   THE GAME: before kick-off, every player calls each match H (home
   win), A (away win) or D (draw). One point per correct call. That's
   the whole ruleset — everything else in here is bookkeeping and
   arguing material.

   ORDER MATTERS. Fixtures sort by kick-off time, then alphabetically
   by home team inside a shared kick-off — the same order FotMob
   shows, and the order the group has always typed its strings in.
   The bulk box maps "HAHHA" onto that sequence one character at a
   time, with "_" to skip, so a WhatsApp message pastes straight in.

   KICK-OFF IS THE LOCK. The database refuses a write once a fixture
   has started (see schema.sql) and refuses to serve anyone's pick
   until then, so nobody can peek and nobody can back-date. Your own
   un-kicked-off picks are mirrored locally, which is why they're
   still visible to you and only you.

   FIXTURES arrive from football-data.org via a GitHub Action
   (scripts/sync-fixtures.mjs) that upserts into pl_fixtures. The app
   never calls that API directly — no key in the page, no CORS.
   ================================================================ */

/* ---------------------------------------------------------------
   1. CONFIG + STORAGE
   --------------------------------------------------------------- */
const CONFIG = {
  supabase: {
    url: "https://iyojwrkfqcxpwdoigmuz.supabase.co",
    anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5b2p3cmtmcWN4cHdkb2lnbXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2Mzc1NTQsImV4cCI6MjA5ODIxMzU1NH0.rtduCfAYXYc2GtUZIE2TXKYKYzSp429y-IakQ5t43YE"
  },
  maxPlayers: 10
};

const mem = new Map();
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch { return mem.get(k) ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch { mem.set(k,v); } },
  del(k){ try { localStorage.removeItem(k); } catch { mem.delete(k); } },
  json(k,fb){ const r=this.get(k); if(!r) return fb; try{ return JSON.parse(r); }catch{ this.del(k); return fb; } }
};
const K = { me:"pl_me", pending:"pl_pending", fixtures:"pl_cache_fixtures", players:"pl_cache_players", picks:"pl_cache_picks" };

/* Dependency-free PostgREST client. Same shape as the whist app's
   adapter: reads fall back to the local mirror, writes go through
   and surface their error rather than failing silently. */
const SB = {
  _h(extra){ const k = CONFIG.supabase.anonKey;
    return { apikey:k, Authorization:`Bearer ${k}`, "Content-Type":"application/json", ...(extra||{}) }; },
  _url(p){ return CONFIG.supabase.url.replace(/\/$/,"") + "/rest/v1/" + p; },
  async get(path){
    const res = await fetch(this._url(path), { headers:this._h() });
    if(!res.ok) throw new Error("HTTP "+res.status+" "+(await res.text()));
    return res.json();
  },
  async rpc(fn, args){
    const res = await fetch(this._url("rpc/" + fn), {
      method:"POST", headers:this._h(), body:JSON.stringify(args)
    });
    const text = await res.text();
    if(!res.ok) throw new Error("HTTP "+res.status+" "+text);
    return text ? JSON.parse(text) : null;
  },
  async post(path, body, prefer){
    const res = await fetch(this._url(path), {
      method:"POST", headers:this._h({ Prefer: prefer || "return=minimal" }), body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error("HTTP "+res.status+" "+(await res.text()));
    return res;
  }
};

/* ---------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b)=> b ? Math.round(a/b*100) : 0;
const PICKS = ["H","A","D"];
const PICK_WORD = { H:"Home win", A:"Away win", D:"Draw" };

const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false});
const fmtDay  = iso => new Date(iso).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"});
const dayKey  = iso => { const d=new Date(iso); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); };

let toastTimer = null;
function toast(msg, bad){
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  $(".toast")?.remove();
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.remove(), bad ? 5200 : 2400);
}

/* ---------------------------------------------------------------
   3. FIXTURE MODEL
   --------------------------------------------------------------- */
const VOID = f => f.status==="POSTPONED" || f.status==="CANCELLED";
const SETTLED = f => f.result === "H" || f.result === "A" || f.result === "D";
const kicked = f => Date.now() >= new Date(f.kickoff).getTime();
const open   = f => !VOID(f) && !kicked(f);

// The one true ordering: kick-off, then home team alphabetically.
function byKickoff(a,b){
  const d = new Date(a.kickoff) - new Date(b.kickoff);
  return d !== 0 ? d : a.home.localeCompare(b.home);
}

function rowToFixture(r){
  return {
    id:r.id, matchday:r.matchday||0, season:r.season,
    kickoff:r.kickoff_utc, kickoffOriginal:r.kickoff_original || r.kickoff_utc,
    home:r.home, away:r.away, homeShort:r.home_short||r.home, awayShort:r.away_short||r.away,
    status:r.status, hg:r.home_goals, ag:r.away_goals, result:r.result
  };
}
const moved = f => f.kickoffOriginal && f.kickoff !== f.kickoffOriginal;

function pickKey(playerId, fixtureId){ return playerId + "|" + fixtureId; }

// Your own pick for a fixture: the server's copy once revealed,
// otherwise the local mirror of what you sent before kick-off.
function myPick(fixtureId){
  if(!state.me) return null;
  const served = state.picks.get(pickKey(state.me, fixtureId));
  if(served && served.pick) return served.pick;
  return state.pending[fixtureId] || (served ? "?" : null);
}
function hasPicked(playerId, fixtureId){
  if(state.picks.has(pickKey(playerId, fixtureId))) return true;
  return playerId === state.me && !!state.pending[fixtureId];
}
// A revealed pick, or null if it's still under wraps / never made.
function revealedPick(playerId, fixtureId){
  const p = state.picks.get(pickKey(playerId, fixtureId));
  return p && p.pick ? p.pick : null;
}

/* ---------------------------------------------------------------
   4. STATE + BOOT
   --------------------------------------------------------------- */
const state = {
  tab: "predict",
  players: [],                 // [{id,name}]
  fixtures: [],                // sorted by kickoff
  picks: new Map(),            // "playerId|fixtureId" -> {pick|null, revealed}
  pending: {},                 // fixtureId -> "H"|"A"|"D"  (mine, pre-kick-off, local only)
  me: null,                    // player id
  season: null,                // active season label
  bulk: "",                    // raw text in the bulk box
  showAll: false,              // predict view: every open fixture vs the next fortnight
  resultsMd: null,             // matchday shown in Results
  statPlayer: null,            // drill-down in Stats
  identityOpen: false,
  saving: false
};

async function boot(){
  state.me = LS.get(K.me);
  state.pending = LS.json(K.pending, {});
  hydrateFromCache();
  render();
  await refresh(true);
}

function hydrateFromCache(){
  state.players  = LS.json(K.players, []);
  state.fixtures = LS.json(K.fixtures, []).map(f=>f).sort(byKickoff);
  state.picks    = new Map(LS.json(K.picks, []));
  pickSeason();
}

function allSeasons(){ return [...new Set(state.fixtures.map(f=>f.season))].sort().reverse(); }
function pickSeason(){
  const seasons = allSeasons();
  if(state.season && seasons.includes(state.season)) return;   // keep an explicit choice
  state.season = seasons[0] || null;
}

// Shown on every retrospective view once there's more than one season
// on file, which is the case as soon as the history is backfilled.
function seasonSeg(){
  const seasons = allSeasons();
  if(seasons.length < 2) return "";
  return `<div class="seg">${seasons.map(s=>
    `<button class="btn sm ghost segbtn" data-season="${esc(s)}" aria-pressed="${s===state.season}">${esc(s)}</button>`).join("")}</div>`;
}

async function refresh(quiet){
  $("#storeBadge").textContent = "Syncing…";
  try{
    const [players, fixtures, picks] = await Promise.all([
      SB.get("pl_players?select=id,name&order=name.asc"),
      SB.get("pl_fixtures?select=*&order=kickoff_utc.asc"),
      SB.get("pl_picks_public?select=player_id,fixture_id,pick,revealed")
    ]);
    state.players  = players;
    state.fixtures = fixtures.map(rowToFixture).sort(byKickoff);
    state.picks    = new Map(picks.map(p=>[pickKey(p.player_id,p.fixture_id), {pick:p.pick, revealed:p.revealed}]));
    pickSeason();
    prunePending();
    LS.set(K.players,  JSON.stringify(state.players));
    LS.set(K.fixtures, JSON.stringify(state.fixtures));
    LS.set(K.picks,    JSON.stringify([...state.picks]));
    $("#storeBadge").textContent = "Live · " + (state.season || "no fixtures");
  }catch(e){
    console.warn("Refresh failed — using cache:", e);
    $("#storeBadge").textContent = "Offline · cached";
    if(!quiet) toast("Couldn't reach the database — showing the last copy.", true);
  }
  render();
}

// Once a pick has been served back to us there's no reason to keep
// the local copy, and a pick for a fixture that has since been
// cancelled is just clutter.
function prunePending(){
  const byId = new Map(state.fixtures.map(f=>[String(f.id), f]));
  let changed = false;
  Object.keys(state.pending).forEach(fid=>{
    const f = byId.get(String(fid));
    const served = state.me && state.picks.get(pickKey(state.me, fid));
    if(!f || VOID(f) || (served && served.pick)){ delete state.pending[fid]; changed = true; }
  });
  if(changed) LS.set(K.pending, JSON.stringify(state.pending));
}

/* ---------------------------------------------------------------
   5. ROUTER
   --------------------------------------------------------------- */
function render(){
  $$("#tabs button").forEach(b=> b.setAttribute("aria-selected", b.dataset.view===state.tab));
  renderWhoami();

  if(state.tab==="predict"){ app.innerHTML = viewPredict(); wirePredict(); return; }

  if(state.tab==="results"){ app.innerHTML = viewResults(); wireResults(); return; }
  app.innerHTML = viewStats(); wireStats();
}

function renderWhoami(){

function viewIdentity(){

function wireIdentity(){
  $$(".namelist button").forEach(b=> b.onclick = ()=>{
    state.me = b.dataset.pid;
    LS.set(K.me, state.me);
    state.identityOpen = false;
    render();
  });

}

/* ---------------------------------------------------------------
   7. PREDICT
   --------------------------------------------------------------- */
const FORTNIGHT = 14*24*3600*1000;

function openFixtures(){ return state.fixtures.filter(open); }

// Bulk strings map onto every open fixture in kick-off order, so a
// leading "_" skips the ones you've already called — exactly how the
// group has always written them in the chat.
function parseBulk(text){
  const out = [];
  for(const ch of (text||"").toUpperCase()){
    if(/\s/.test(ch)) continue;
    if(ch==="_"||ch==="-"||ch==="."||ch==="*"){ out.push(null); continue; }
    if(PICKS.includes(ch)){ out.push(ch); continue; }
    out.push("!");                       // anything else is a typo, flagged below
  }
  return out;
}

function viewPredict(){
  const all = openFixtures();
  if(!all.length){
    return `<section class="panel"><h2>Predict</h2>
      <div class="empty">${state.fixtures.length ? "Nothing to call." : "No fixtures loaded yet."}</div>
      ${dataState()}${refreshRow()}</section>`;
  }

  const horizon = Date.now() + FORTNIGHT;
  const shown = state.showAll ? all : all.filter(f=> new Date(f.kickoff).getTime() <= horizon);
  const list  = shown.length ? shown : all.slice(0, 10);
  const hidden = all.length - list.length;

  const mine = list.filter(f=>myPick(f.id)).length;
  const groups = [];
  let last = null;
  list.forEach(f=>{
    const k = dayKey(f.kickoff);
    if(k !== last){ groups.push({key:k, iso:f.kickoff, md:f.matchday, items:[]}); last = k; }
    groups[groups.length-1].items.push(f);
  });

  const body = groups.map(g=>`
    <div class="daybar"><h3>${esc(fmtDay(g.iso))}</h3><span class="md">Matchday ${g.md||"?"}</span></div>
    ${g.items.map(f=> fixtureRow(f, all.indexOf(f))).join("")}
  `).join("");

  return `<section class="panel">
    <h2>Predict</h2>
    <div class="sub">${mine} of ${list.length} called${hidden>0?` · ${hidden} more later in the season`:""}</div>

    <div class="bulk" style="margin-top:14px">
      <input type="text" id="bulkBox" value="${esc(state.bulk)}" placeholder="HAHHA"
        autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="60" />
      <div class="hint" id="bulkHint"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" id="bulkClear" style="flex:1">Clear</button>
        <button class="btn sm" id="bulkApply" style="flex:2" disabled>Apply</button>
      </div>
    </div>

    <div style="margin-top:6px">${body}</div>
    ${list.some(moved) ? `<div class="sub" style="margin-top:10px">&dagger; kick-off moved since the fixture was first published.</div>` : ""}
    ${hidden>0 || state.showAll ? `<div class="row" style="margin-top:14px">
      <button class="btn ghost sm" id="toggleAll">${state.showAll?"Show next fortnight only":`Show all ${all.length} open fixtures`}</button>
    </div>` : ""}
    ${refreshRow()}
  </section>`;
}

// Shown whenever there's nothing to predict: says what is actually on
// file, so "no upcoming fixtures" can't be mistaken for "all played".
function dataState(){
  const fx = state.fixtures;
  if(!fx.length) return `<div class="sub" style="text-align:center">Run the sync workflow, then refresh.</div>`;
  const future = fx.filter(f=> !kicked(f));
  const last = fx[fx.length-1];
  const seasons = [...new Set(fx.map(f=>f.season))].sort();
  return `<div class="sub" style="text-align:center;line-height:1.7">
    ${fx.length} fixtures on file across ${seasons.join(", ")}.<br>
    ${future.length} still to kick off${future.length ? ` — next is ${esc(future[0].homeShort)} v ${esc(future[0].awayShort)}, ${esc(fmtDay(future[0].kickoff))} ${esc(fmtTime(future[0].kickoff))}` : ""}.<br>
    Latest kick-off stored: ${esc(fmtDay(last.kickoff))} ${esc(fmtTime(last.kickoff))}.<br>
    This device thinks it is ${esc(fmtDay(new Date().toISOString()))} ${esc(fmtTime(new Date().toISOString()))}.
  </div>`;
}

function refreshRow(){
  return `<div class="row" style="margin-top:14px">
    <button class="btn ghost sm" id="refreshBtn">Refresh fixtures</button>
    <button class="btn ghost sm" id="copyBtn">Copy my string</button>
  </div>`;
}

function fixtureRow(f, idx){
  const mv = moved(f);
  const ko = `<div class="ko${mv?" moved":""}" title="${mv?`Moved from ${esc(fmtDay(f.kickoffOriginal))} ${esc(fmtTime(f.kickoffOriginal))}`:""}">${esc(fmtTime(f.kickoff))}${mv?"&dagger;":""}</div>`;
  const others = state.players.filter(p=>p.id!==state.me);
  const dots = others.length ? `<div class="whodunnit" title="Who's called it">${
    others.map(p=>`<span class="${hasPicked(p.id,f.id)?"in":""}"></span>`).join("")}</div>` : "";
  const cur = myPick(f.id);
  // "?" means the server has a pick from you but won't hand it back
  // before kick-off, and this device wasn't the one that made it.
  const elsewhere = cur === "?" ? `<div class="note">called on another device</div>` : "";
  const btns = PICKS.map(p=>`<button class="pk" data-fx="${f.id}" data-pick="${p}"
      aria-pressed="${cur===p}" aria-label="${PICK_WORD[p]}" title="${PICK_WORD[p]}">${p}</button>`).join("");
  return `<div class="fx" data-fxrow="${f.id}" data-idx="${idx}">
    ${ko}
    <div class="teams"><div class="t">${esc(f.homeShort)}</div><div class="t">${esc(f.awayShort)}</div>${elsewhere}${dots}</div>
    <div class="picks">${btns}</div>
  </div>`;
}

function wirePredict(){
  wireCommon();
  $$(".pk").forEach(b=> b.onclick = ()=> savePick(b.dataset.fx, b.dataset.pick));
  $("#toggleAll") && ($("#toggleAll").onclick = ()=>{ state.showAll=!state.showAll; render(); });

  const box = $("#bulkBox");
  if(!box) return;
  const repaint = ()=>{ state.bulk = box.value; paintBulk(); };
  box.oninput = repaint;
  $("#bulkClear").onclick = ()=>{ box.value=""; state.bulk=""; paintBulk(); box.focus(); };
  $("#bulkApply").onclick = applyBulk;
  paintBulk();
  // Land straight in the box on a fresh visit — the common case is
  // pasting a string, not tapping twenty buttons. Only on first
  // mount, so a background refresh never steals the caret.
  if(!state.bulk && !bulkFocused){ box.focus({preventScroll:true}); bulkFocused = true; }
}
let bulkFocused = false;

// Paints the parsed string onto the fixture rows without re-rendering,
// so the input keeps focus and the caret while you type.
function paintBulk(){
  const letters = parseBulk(state.bulk);
  const all = openFixtures();
  $$(".pk").forEach(b=> b.classList.remove("preview"));
  let applied = 0, bad = 0;
  letters.forEach((ch, i)=>{
    if(ch === "!"){ bad++; return; }
    if(ch === null || i >= all.length) return;
    const f = all[i];
    const btn = $(`.pk[data-fx="${f.id}"][data-pick="${ch}"]`);
    if(btn && btn.getAttribute("aria-pressed") !== "true"){ btn.classList.add("preview"); }
    applied++;
  });
  const over = Math.max(0, letters.length - all.length);
  const hint = $("#bulkHint"), apply = $("#bulkApply");
  if(!letters.length){
    hint.innerHTML = `One letter per fixture, in the order below. <b class="tally">_</b> skips one.`;
    apply.disabled = true;
  }else if(bad){
    hint.innerHTML = `<span class="bad">Only H, A, D and _ please — ${bad} character${bad===1?"":"s"} won't map.</span>`;
    apply.disabled = true;
  }else if(over){
    hint.innerHTML = `<span class="bad">${letters.length} letters but only ${all.length} fixtures open — ${over} too many.</span>`;
    apply.disabled = true;
  }else{
    const offscreen = letters.length - $$(".fx").length;
    hint.innerHTML = `<span class="tally">${applied}</span> pick${applied===1?"":"s"} across the next <span class="tally">${letters.length}</span> fixture${letters.length===1?"":"s"}.`
      + (offscreen > 0 ? ` <span class="bad">${offscreen} beyond the list below.</span>` : "");
    apply.disabled = applied === 0;
  }
  const first = $(".pk.preview");
  if(first) first.closest(".fx")?.scrollIntoView({block:"nearest"});
}

async function applyBulk(){
  const letters = parseBulk(state.bulk);
  const all = openFixtures();
  const rows = [];
  letters.forEach((ch,i)=>{ if(ch && ch!=="!" && i<all.length) rows.push({fixture:all[i], pick:ch}); });
  if(!rows.length) return;
  $("#bulkApply").disabled = true;
  const ok = await sendPicks(rows);
  if(ok){ state.bulk = ""; toast(`${rows.length} prediction${rows.length===1?"":"s"} in.`); }
  render();
}

async function savePick(fixtureId, pick){
  const f = state.fixtures.find(x=>String(x.id)===String(fixtureId));
  if(!f) return;
  if(myPick(f.id) === pick) return;                 // tapping the same pick is a no-op, not a toggle-off
  await sendPicks([{fixture:f, pick}]);
  render();
}

// One upsert for the batch. The database re-checks kick-off on every
// row, so a fixture that started while the page was open is rejected
// there rather than trusted from here.
async function sendPicks(rows){
  if(!state.me) { toast("Pick your name first.", true); return false; }
  const live = rows.filter(r=> open(r.fixture));
  if(live.length < rows.length) toast("Some of those have kicked off — skipped.", true);
  if(!live.length) return false;
  live.forEach(r=> state.pending[r.fixture.id] = r.pick);
  LS.set(K.pending, JSON.stringify(state.pending));
  try{
    const verdicts = await SB.rpc("pl_predict_batch", {
      p_player: state.me,
      p_picks: live.map(r=>({ fixture_id: r.fixture.id, pick: r.pick }))
    }) || [];
    const refused = verdicts.filter(v=> !v.ok);
    verdicts.filter(v=> v.ok).forEach(v=>
      state.picks.set(pickKey(state.me, v.fid), {pick:null, revealed:false}));
    refused.forEach(v=> delete state.pending[v.fid]);
    LS.set(K.pending, JSON.stringify(state.pending));
    LS.set(K.picks, JSON.stringify([...state.picks]));
    if(refused.length){
      const f = state.fixtures.find(x=> String(x.id)===String(refused[0].fid));
      toast(refused.length === 1 && f
        ? `${f.homeShort} v ${f.awayShort}: ${refused[0].why}.`
        : `${refused.length} refused — ${refused[0].why}.`, true);
    }
    return refused.length < live.length;
  }catch(e){
    console.warn("sendPicks failed:", e);
    live.forEach(r=> delete state.pending[r.fixture.id]);
    LS.set(K.pending, JSON.stringify(state.pending));
    toast(String(e).includes("PGRST202")
      ? "The database is missing pl_predict_batch — run fix-write-path.sql."
      : "Couldn't save: " + String(e).replace(/^Error:s*/, "").slice(0, 120), true);
    return false;
  }
}

function wireCommon(){
  $$(".segbtn[data-season]").forEach(b=> b.onclick = ()=>{
    state.season = b.dataset.season; state.resultsMd = null; state.statPlayer = null; render();
  });
  $("#refreshBtn") && ($("#refreshBtn").onclick = ()=> refresh(false));
  $("#copyBtn") && ($("#copyBtn").onclick = ()=>{
    const all = openFixtures();
    const s = all.map(f=> myPick(f.id) || "_").join("").replace(/_+$/,"");
    if(!s) return toast("Nothing to copy yet.");
    navigator.clipboard?.writeText(s).then(()=> toast("Copied: " + s), ()=> toast(s));
  });
}

/* ---------------------------------------------------------------
   8. SCORING
   --------------------------------------------------------------- */
function seasonFixtures(){ return state.fixtures.filter(f=> !state.season || f.season===state.season); }
function settledFixtures(){ return seasonFixtures().filter(SETTLED); }

// Every derived number in the app comes off this one pass, so the
// Table, Results and Stats views can never disagree with each other.
function computeSeason(){
  const fixtures = settledFixtures();
  const players = state.players.map(p=>({
    id:p.id, name:p.name,
    played:0, correct:0, missed:0,
    byPick:{H:{n:0,ok:0},A:{n:0,ok:0},D:{n:0,ok:0}},
    bestStreak:0, curStreak:0, _run:0,
    solo:0, blind:0, withHerd:0, herdN:0,
    byMd:{}, teams:{}, series:[], form:[],
    firstAt:null
  }));
  const byId = new Map(players.map(p=>[p.id,p]));

  // Where each player joined in, so a late arrival isn't billed for
  // fixtures that were settled before they existed.
  state.picks.forEach((v,k)=>{
    const [pid,fid] = k.split("|");
    const p = byId.get(pid); const f = state.fixtures.find(x=>String(x.id)===fid);
    if(!p || !f) return;
    const t = new Date(f.kickoff).getTime();
    if(p.firstAt===null || t < p.firstAt) p.firstAt = t;
  });

  const actual = {H:0,A:0,D:0};
  const drama = [];        // per-fixture, for the banana-skin awards
  const md = new Set();

  fixtures.forEach(f=>{
    actual[f.result]++;
    const ko = new Date(f.kickoff).getTime();
    const calls = players.map(p=>({p, pick: revealedPick(p.id, f.id)})).filter(x=>x.pick);
    const tally = {H:0,A:0,D:0}; calls.forEach(c=> tally[c.pick]++);
    const top = Math.max(tally.H, tally.A, tally.D);
    const modal = PICKS.filter(x=>tally[x]===top);
    const rightCount = calls.filter(c=>c.pick===f.result).length;
    md.add(f.matchday);

    players.forEach(p=>{
      const call = calls.find(c=>c.p===p);
      if(!call){
        if(p.firstAt !== null && ko >= p.firstAt) p.missed++;
        return;
      }
      const hit = call.pick === f.result;
      p.played++;
      p.byPick[call.pick].n++;
      if(hit){ p.byPick[call.pick].ok++; p.correct++; p._run++; p.bestStreak = Math.max(p.bestStreak, p._run); }
      else p._run = 0;
      p.form.push(hit);
      if(hit && rightCount===1 && calls.length>1) p.solo++;
      if(!hit && rightCount===calls.length-1 && calls.length>1) p.blind++;
      if(calls.length>1){ p.herdN++; if(modal.includes(call.pick)) p.withHerd++; }

      const m = p.byMd[f.matchday] || (p.byMd[f.matchday] = {n:0, ok:0});
      m.n++; if(hit) m.ok++;
      [f.homeShort, f.awayShort].forEach(t=>{
        const tr = p.teams[t] || (p.teams[t] = {n:0, ok:0});
        tr.n++; if(hit) tr.ok++;
      });
    });

    if(calls.length >= 2) drama.push({fixture:f, calls, right:rightCount});
  });

  players.forEach(p=>{
    p.curStreak = p._run;
    p.acc = pct(p.correct, p.played);
    p.form = p.form.slice(-6);
  });

  // Cumulative points by matchday — the shape of the season.
  const mds = [...md].sort((a,b)=>a-b);
  players.forEach(p=>{
    let run = 0;
    p.series = mds.map(m=>{ run += (p.byMd[m]?.ok || 0); return run; });
  });

  // Two baselines worth beating: always calling the home side, and
  // always calling whatever the group's majority called.
  let homeAlways = 0;
  fixtures.forEach(f=>{ if(f.result==="H") homeAlways++; });

  players.sort((a,b)=> b.correct-a.correct || b.acc-a.acc || a.name.localeCompare(b.name));
  return { players, fixtures, mds, actual, drama, homeAlways, total:fixtures.length };
}

// Matchday winners: outright if alone on top, shared otherwise. Only
// counted where everyone in contention actually had picks in.
function matchdayWinners(season){
  const out = {};
  season.mds.forEach(m=>{
    const scores = season.players
      .filter(p=> (p.byMd[m]?.n || 0) > 0)
      .map(p=>({p, ok:p.byMd[m].ok}));
    if(scores.length < 2) return;
    const top = Math.max(...scores.map(s=>s.ok));
    const win = scores.filter(s=>s.ok===top);
    out[m] = { top, winners: win.map(s=>s.p) };
  });
  return out;
}

/* ---------------------------------------------------------------
   9. TABLE
   --------------------------------------------------------------- */
function viewTable(){
  const s = computeSeason();
  if(!s.total){
    return `<section class="panel"><h2>Table</h2>
      <div class="empty">Nothing settled yet. The table fills in as results land.</div>${refreshRow()}</section>`;
  }
  const wins = matchdayWinners(s);
  const mdWins = {};
  Object.values(wins).forEach(w=> w.winners.forEach(p=> mdWins[p.id] = (mdWins[p.id]||0) + (w.winners.length===1?1:0)));

  const rows = s.players.map((p,i)=>{
    const form = p.form.map(ok=>`<i class="${ok?"ok":"no"}"></i>`).join("");
    const streak = p.curStreak >= 3 ? ` <span class="streak" title="correct in a row">+${p.curStreak}</span>` : "";
    return `<tr class="${p.id===state.me?"me":""}">
      <td class="num">${i+1}</td>
      <td>${esc(p.name)}${streak}</td>
      <td class="num">${p.played}</td>
      <td class="num" style="color:var(--mark);font-weight:700">${p.correct}</td>
      <td class="num">${p.acc}%</td>
      <td class="num">${mdWins[p.id]||0}</td>
      <td><div class="form">${form}</div></td>
    </tr>`;
  }).join("");

  const leader = s.players[0];
  const chase = s.players[1];
  const gap = leader && chase ? leader.correct - chase.correct : 0;

  const chart = cumulativeChart(s);
  const beat = s.players.filter(p=> p.correct > Math.round(s.homeAlways * (p.played/s.total || 0))).length;

  return `<section class="panel">
    <h2>Table</h2>
    <div class="sub">${s.total} match${s.total===1?"":"es"} settled</div>
    ${seasonSeg()}
    <div class="keys" style="margin-top:14px">
      <div class="key"><div class="big">${leader ? esc(leader.correct) : 0}</div><div class="lbl">Top score · ${esc(leader?.name||"")}</div></div>
      <div class="key"><div class="big">${gap}</div><div class="lbl">Lead over ${esc(chase?.name||"the pack")}</div></div>
      <div class="key"><div class="big">${pct(s.actual.H, s.total)}%</div><div class="lbl">Home wins this season</div></div>
      <div class="key"><div class="big">${beat}/${s.players.length}</div><div class="lbl">Beating "always home"</div></div>
    </div>
    <div class="scroller" style="margin-top:8px">
      <table class="grid">
        <thead><tr><th class="num">#</th><th>Player</th><th class="num">P</th><th class="num">Pts</th>
          <th class="num">Acc</th><th class="num">MD</th><th>Form</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="sub" style="margin-top:8px">P played · Pts correct calls · MD outright matchday wins · form runs oldest to newest.</div>
    ${chart}
    ${refreshRow()}
  </section>`;
}

/* ---------------------------------------------------------------
   10. RESULTS
   --------------------------------------------------------------- */
function viewResults(){
  const fx = seasonFixtures().filter(f=> kicked(f) && !VOID(f));
  if(!fx.length) return `<section class="panel"><h2>Results</h2><div class="empty">No matches played yet.</div>${refreshRow()}</section>`;

  const mds = [...new Set(fx.map(f=>f.matchday))].sort((a,b)=>b-a);
  const md = state.resultsMd != null && mds.includes(state.resultsMd) ? state.resultsMd : mds[0];
  const list = fx.filter(f=>f.matchday===md).sort(byKickoff);

  const seg = `<div class="seg">${mds.slice(0,18).map(m=>
    `<button class="btn sm ghost segbtn" data-md="${m}" aria-pressed="${m===md}">MD ${m}</button>`).join("")}</div>`;

  const cols = state.players;
  const head = `<tr><th>Match</th><th class="num">Score</th><th class="res">Res</th>${
    cols.map(p=>`<th class="cell" title="${esc(p.name)}">${esc(p.name.slice(0,3))}</th>`).join("")}</tr>`;

  const body = list.map(f=>{
    const score = (f.hg==null||f.ag==null) ? "&ndash;" : `${f.hg}&ndash;${f.ag}`;
    const cells = cols.map(p=>{
      const pk = revealedPick(p.id, f.id);
      if(!pk) return `<td class="cell"><span class="b none">&middot;</span></td>`;
      if(!SETTLED(f)) return `<td class="cell"><span class="b">${pk}</span></td>`;
      return `<td class="cell"><span class="b ${pk===f.result?"ok":"no"}">${pk}</span></td>`;
    }).join("");
    const live = !SETTLED(f) ? ` <span class="tag live">${esc((f.status||"").toLowerCase())}</span>` : "";
    return `<tr><td>${esc(f.homeShort)} v ${esc(f.awayShort)}${live}</td>
      <td class="num">${score}</td><td class="res">${f.result||"&ndash;"}</td>${cells}</tr>`;
  }).join("");

  const tot = cols.map(p=>{
    const ok = list.filter(f=> SETTLED(f) && revealedPick(p.id,f.id)===f.result).length;
    return `<td class="cell">${ok}</td>`;
  }).join("");

  return `<section class="panel">
    <h2>Results</h2>
    <div class="sub">Everyone&rsquo;s calls, revealed at kick-off.</div>
    ${seasonSeg()}
    ${seg}
    <div class="scroller" style="margin-top:10px">
      <table class="grid"><thead>${head}</thead><tbody>${body}
        <tr class="totals"><td colspan="3">Matchday points</td>${tot}</tr>
      </tbody></table>
    </div>
    ${refreshRow()}
  </section>`;
}

function wireResults(){
  wireCommon();
  $$(".segbtn[data-md]").forEach(b=> b.onclick = ()=>{ state.resultsMd = +b.dataset.md; render(); });
}

/* ---------------------------------------------------------------
   11. CHARTS  (hand-rolled SVG — keeps this a single file)
   --------------------------------------------------------------- */
const SWATCH = ["#d9a536","#4c9e69","#5b8cb8","#a5424e","#8e7cb0","#c17f45","#6fae8e","#b06a86","#7d94ad","#9a9a5c"];

function barChartSVG(items, opts={}){
  if(!items.length) return "";
  const W = opts.width||540, barH = opts.barH||19, gap = 8;
  const leftW = opts.leftW||92, rightW = opts.rightW||48;
  const plotW = Math.max(40, W-leftW-rightW);
  const max = opts.max || Math.max(1, ...items.map(it=>Math.abs(it.value)));
  const H = items.length*(barH+gap)+gap;
  const fmt = opts.valFmt || (v=>v);
  const rows = items.map((it,i)=>{
    const y = gap + i*(barH+gap);
    const w = it.value<=0 ? 0 : Math.max(2,(it.value/max)*plotW);
    return `<text x="${leftW-8}" y="${y+barH*0.72}" text-anchor="end" font-family="Space Mono" font-size="11" style="fill:var(--chalk)">${esc(it.label)}</text>
      <rect x="${leftW}" y="${y}" width="${plotW}" height="${barH}" rx="5" style="fill:rgba(233,238,247,.06)"/>
      <rect x="${leftW}" y="${y}" width="${w}" height="${barH}" rx="5" style="fill:${it.color||"var(--mark)"}"/>
      <text x="${leftW+plotW+8}" y="${y+barH*0.72}" font-family="Space Mono" font-size="11" style="fill:var(--mark)">${esc(String(fmt(it.value)))}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(opts.label||"chart")}">${rows}</svg>`;
}

// One line per player, cumulative points against matchday.
function cumulativeChart(s){
  const withData = s.players.filter(p=>p.played>0);
  if(s.mds.length < 2 || !withData.length) return "";
  const W=540, H=200, padL=30, padR=10, padT=12, padB=22;
  const max = Math.max(1, ...withData.map(p=>p.series[p.series.length-1]));
  const stepX = (W-padL-padR)/Math.max(1, s.mds.length-1);
  const y = v => H-padB-(v/max)*(H-padT-padB);
  const grid = [0,.5,1].map(r=>{
    const yy = y(max*r);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" style="stroke:rgba(233,238,247,.09)"/>
      <text x="${padL-6}" y="${yy+3.5}" text-anchor="end" font-family="Space Mono" font-size="9.5" style="fill:var(--ash)">${Math.round(max*r)}</text>`;
  }).join("");
  const lines = withData.map((p,i)=>{
    const col = SWATCH[i % SWATCH.length];
    const d = p.series.map((v,j)=> (j?"L":"M")+(padL+j*stepX).toFixed(1)+","+y(v).toFixed(1)).join(" ");
    const last = p.series[p.series.length-1];
    return `<path d="${d}" fill="none" style="stroke:${col};stroke-width:2;stroke-linejoin:round"/>
      <circle cx="${(padL+(p.series.length-1)*stepX).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3" style="fill:${col}"/>`;
  }).join("");
  const xlab = `<text x="${padL}" y="${H-6}" font-family="Space Mono" font-size="9.5" style="fill:var(--ash)">MD ${s.mds[0]}</text>
    <text x="${W-padR}" y="${H-6}" text-anchor="end" font-family="Space Mono" font-size="9.5" style="fill:var(--ash)">MD ${s.mds[s.mds.length-1]}</text>`;
  const legend = withData.map((p,i)=>
    `<span><b style="background:${SWATCH[i%SWATCH.length]}"></b>${esc(p.name)}</span>`).join("");
  return `<div class="chart-card"><div class="ctitle">Points through the season</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cumulative points">
      ${grid}${lines}${xlab}
    </svg><div class="legend">${legend}</div></div>`;
}

/* ---------------------------------------------------------------
   12. STATS
   --------------------------------------------------------------- */
function viewStats(){
  const s = computeSeason();
  if(!s.total){
    return `<section class="panel"><h2>Stats</h2>
      <div class="empty">Nothing to pick over yet. Come back after a matchday.</div>${refreshRow()}</section>`;
  }
  if(state.statPlayer){
    const p = s.players.find(x=>x.id===state.statPlayer);
    if(p) return playerPanel(p, s);
    state.statPlayer = null;
  }

  const MIN = 12;                        // sample floor before a rate-based award means anything
  const eligible = s.players.filter(p=>p.played >= MIN);
  const pool = eligible.length ? eligible : s.players.filter(p=>p.played>0);
  const best = (fn, from)=> (from||pool).reduce((b,p)=> (b===null || fn(p) > fn(b)) ? p : b, null);

  // Fixture-level superlatives
  const banana = s.drama.filter(d=>d.right===0).sort((a,b)=>b.calls.length-a.calls.length)[0];
  const gimme  = s.drama.filter(d=>d.right===d.calls.length).length;
  const wins = matchdayWinners(s);
  const mdWins = {}, mdShare = {};
  Object.values(wins).forEach(w=> w.winners.forEach(p=>{
    if(w.winners.length===1) mdWins[p.id]=(mdWins[p.id]||0)+1; else mdShare[p.id]=(mdShare[p.id]||0)+1;
  }));

  const bestMd = pool.map(p=>{
    const e = Object.entries(p.byMd).filter(([,v])=>v.n>=5).sort((a,b)=> b[1].ok-a[1].ok)[0];
    return e ? {p, md:+e[0], ok:e[1].ok, n:e[1].n} : null;
  }).filter(Boolean).sort((a,b)=> b.ok-a.ok || a.n-b.n)[0];

  const pair = pairStats(s);

  const tiles = [
    `<div class="key"><div class="big">${s.total}</div><div class="lbl">Matches settled</div></div>`,
    `<div class="key"><div class="big">${pct(s.actual.H,s.total)}/${pct(s.actual.D,s.total)}/${pct(s.actual.A,s.total)}</div><div class="lbl">Actual H / D / A split</div></div>`,
    `<div class="key"><div class="big">${gimme}</div><div class="lbl">Matches nobody got wrong</div></div>`,
    banana ? `<div class="key"><div class="big">0/${banana.calls.length}</div><div class="lbl">Banana skin · ${esc(banana.fixture.homeShort)} v ${esc(banana.fixture.awayShort)} (${banana.fixture.result})</div></div>` : "",
    bestMd ? `<div class="key"><div class="big">${bestMd.ok}/${bestMd.n}</div><div class="lbl">Best matchday · ${esc(bestMd.p.name)}, MD${bestMd.md}</div></div>` : ""
  ].join("");

  const A = [];
  const add = (label, ok, html, note)=>{ if(ok) A.push(
    `<li><span>${label}${note?`<br><span class="aw">${note}</span>`:""}</span><span class="pts">${html}</span></li>`); };

  const sharp     = best(p=>p.acc);
  const drawer    = best(p=>p.byPick.D.ok);
  const drawShy   = pool.reduce((b,p)=> (b===null || p.byPick.D.n < b.byPick.D.n) ? p : b, null);
  const homer     = best(p=>p.byPick.H.n/Math.max(1,p.played));
  const awayday   = best(p=>p.byPick.A.n/Math.max(1,p.played));
  const maverick  = pool.reduce((b,p)=> (p.herdN>=MIN && (b===null || p.withHerd/p.herdN < b.withHerd/b.herdN)) ? p : b, null);
  const sheep     = pool.reduce((b,p)=> (p.herdN>=MIN && (b===null || p.withHerd/p.herdN > b.withHerd/b.herdN)) ? p : b, null);
  const soloist   = best(p=>p.solo);
  const clown     = best(p=>p.blind);
  const streaker  = best(p=>p.bestStreak);
  const absentee  = best(p=>p.missed);
  const mdKing    = s.players.reduce((b,p)=> (b===null || (mdWins[p.id]||0) > (mdWins[b.id]||0)) ? p : b, null);

  const teamAward = (want)=>{
    let out = null;
    pool.forEach(p=> Object.entries(p.teams).forEach(([t,v])=>{
      if(v.n < 6) return;
      const rate = v.ok/v.n;
      if(!out || (want==="best" ? rate > out.rate : rate < out.rate)) out = {p, t, rate, n:v.n, ok:v.ok};
    }));
    return out;
  };
  const bogey = teamAward("worst"), charm = teamAward("best");

  add("Sharpest",           sharp && sharp.played,        `${esc(sharp.name)} · ${sharp.acc}%`, "highest strike rate");
  add("Draw specialist",    drawer && drawer.byPick.D.ok, `${esc(drawer.name)} · ${drawer.byPick.D.ok}/${drawer.byPick.D.n}`, "the hardest call to get right");
  // A one-sided award is meaningless when the same player takes both
  // ends of it — that just means the sample is too thin to separate.
  add("Draw denier",        drawShy && drawShy!==drawer,  drawShy && `${esc(drawShy.name)} · ${drawShy.byPick.D.n} draws called`, "calls the fewest draws");
  add("Homer",              homer,                        homer && `${esc(homer.name)} · ${pct(homer.byPick.H.n,homer.played)}% H`, "backs the home side most often");
  add("Away backer",  awayday && awayday!==homer && awayday.byPick.A.n, awayday && `${esc(awayday.name)} · ${pct(awayday.byPick.A.n,awayday.played)}% A`, "");
  add("Maverick",           !!maverick,                   maverick && `${esc(maverick.name)} · ${pct(maverick.withHerd,maverick.herdN)}% with the group`, "least often with the majority");
  add("With the room",              !!sheep && sheep!==maverick,  sheep && `${esc(sheep.name)} · ${pct(sheep.withHerd,sheep.herdN)}% with the group`, "most often with the majority");
  add("Against the room",        soloist && soloist.solo,      soloist && `${esc(soloist.name)} · ${soloist.solo}`, "right when everyone else was wrong");
  add("Only one who missed",clown && clown.blind,         clown && `${esc(clown.name)} · ${clown.blind}`, "wrong when everyone else was right");
  add("Longest run",        streaker && streaker.bestStreak>2, streaker && `${esc(streaker.name)} · ${streaker.bestStreak} in a row`, "");
  add("Most matchdays won",      mdKing && (mdWins[mdKing.id]||0)>0, mdKing && `${esc(mdKing.name)} · ${mdWins[mdKing.id]}`, "outright weekly wins");
  add("Bogey team",         !!bogey,                      bogey && `${esc(bogey.p.name)} · ${esc(bogey.t)} ${bogey.ok}/${bogey.n}`, "worst read on one club");
  const sameEntry = bogey && charm && bogey.p===charm.p && bogey.t===charm.t;
  add("Lucky charm",        charm && !sameEntry,          charm && `${esc(charm.p.name)} · ${esc(charm.t)} ${charm.ok}/${charm.n}`, "");
  add("Shared brain",       !!pair.closest,               pair.closest && `${esc(pair.closest.a)} &amp; ${esc(pair.closest.b)} · ${pair.closest.rate}%`, "most identical calls");
  add("Never agree",        !!pair.furthest,              pair.furthest && `${esc(pair.furthest.a)} &amp; ${esc(pair.furthest.b)} · ${pair.furthest.rate}%`, "");
  add("Ghost",              absentee && absentee.missed>0, absentee && `${esc(absentee.name)} · ${absentee.missed}`, "most deadlines missed");

  const accChart = barChartSVG(
    [...s.players].filter(p=>p.played>0).sort((a,b)=>b.acc-a.acc).map((p,i)=>({label:p.name, value:p.acc, color:SWATCH[i%SWATCH.length]})),
    {valFmt:v=>v+"%", label:"strike rate"});

  const styleChart = pickMixChart(s);

  const drill = s.players.filter(p=>p.played>0).map(p=>
    `<button class="btn sm ghost segbtn" data-player="${esc(p.id)}">${esc(p.name)}</button>`).join("");

  return `<section class="panel">
    <h2>Stats</h2>
    <div class="sub">Minimum ${MIN} calls for a rate-based award.</div>
    ${seasonSeg()}
    <div class="keys" style="margin-top:14px">${tiles}</div>
    <h3 class="sect">Awards</h3>
    <ul class="awards">${A.join("")}</ul>
    <div class="chart-card"><div class="ctitle">Strike rate</div>${accChart}</div>
    ${styleChart}
    <h3 class="sect">Player profiles</h3>
    <div class="seg">${drill}</div>
    ${refreshRow()}
  </section>`;
}

// Agreement between every pair, over the fixtures both of them called.
function pairStats(s){
  let closest = null, furthest = null;
  const ps = s.players.filter(p=>p.played>0);
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    let same=0, n=0;
    s.fixtures.forEach(f=>{
      const a = revealedPick(ps[i].id,f.id), b = revealedPick(ps[j].id,f.id);
      if(!a||!b) return;
      n++; if(a===b) same++;
    });
    if(n < 12) continue;
    const rate = pct(same,n);
    const rec = {a:ps[i].name, b:ps[j].name, rate, n};
    if(!closest  || rate > closest.rate)  closest  = rec;
    if(!furthest || rate < furthest.rate) furthest = rec;
  }
  return {closest, furthest: (closest && furthest && closest.a===furthest.a && closest.b===furthest.b) ? null : furthest};
}

// How each player's H/D/A habit compares to how the season actually went.
function pickMixChart(s){
  const ps = s.players.filter(p=>p.played>0);
  if(!ps.length) return "";
  const rows = [
    {name:"Reality", H:pct(s.actual.H,s.total), D:pct(s.actual.D,s.total), A:pct(s.actual.A,s.total)},
    ...ps.map(p=>({name:p.name, H:pct(p.byPick.H.n,p.played), D:pct(p.byPick.D.n,p.played), A:pct(p.byPick.A.n,p.played)}))
  ];
  const W=540, rowH=22, gap=7, leftW=92, plotW=W-leftW-14;
  const H = rows.length*(rowH+gap)+gap;
  const cols = {H:"#4c9e69", D:"#d9a536", A:"#5b8cb8"};
  const bars = rows.map((r,i)=>{
    const y = gap+i*(rowH+gap);
    let x = leftW;
    const segs = ["H","D","A"].map(k=>{
      const w = (r[k]/100)*plotW;
      const seg = `<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(0,w).toFixed(1)}" height="${rowH}" style="fill:${cols[k]};opacity:${i?0.85:1}"/>` +
        (w>26 ? `<text x="${(x+w/2).toFixed(1)}" y="${y+rowH*0.7}" text-anchor="middle" font-family="Space Mono" font-size="10" style="fill:#0b0d10;font-weight:700">${r[k]}</text>` : "");
      x += w; return seg;
    }).join("");
    return `<text x="${leftW-8}" y="${y+rowH*0.7}" text-anchor="end" font-family="Space Mono" font-size="11" style="fill:${i?"var(--chalk)":"var(--ash)"}">${esc(r.name)}</text>${segs}`;
  }).join("");
  return `<div class="chart-card"><div class="ctitle">Calling style vs how the season actually went</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pick mix">${bars}</svg>
    <div class="legend"><span><b style="background:#4c9e69"></b>Home</span><span><b style="background:#d9a536"></b>Draw</span><span><b style="background:#5b8cb8"></b>Away</span></div></div>`;
}

function playerPanel(p, s){
  const line = (k)=>{
    const v = p.byPick[k];
    return `<li><span>${PICK_WORD[k]}s called</span><span class="pts">${v.ok}/${v.n} · ${pct(v.ok,v.n)}%</span></li>`;
  };
  const teams = Object.entries(p.teams).filter(([,v])=>v.n>=4).sort((a,b)=> (b[1].ok/b[1].n)-(a[1].ok/a[1].n));
  const bestT = teams.slice(0,3), worstT = teams.slice(-3).reverse();
  const mdRows = Object.entries(p.byMd).sort((a,b)=>a[0]-b[0]).map(([m,v])=>({label:"MD"+m, value:v.ok}));
  const rank = s.players.findIndex(x=>x.id===p.id)+1;

  return `<section class="panel">
    <div class="row" style="margin-bottom:10px"><button class="btn ghost sm" id="backStats" style="flex:0 0 auto">&lsaquo; All stats</button></div>
    <h2>${esc(p.name)}</h2>
    <div class="sub">${rank}${["st","nd","rd"][rank-1]||"th"} of ${s.players.length} · ${p.correct} from ${p.played}</div>
    <div class="keys" style="margin-top:14px">
      <div class="key"><div class="big">${p.acc}%</div><div class="lbl">Strike rate</div></div>
      <div class="key"><div class="big">${p.bestStreak}</div><div class="lbl">Longest run</div></div>
      <div class="key"><div class="big">${p.solo}</div><div class="lbl">Right when all others wrong</div></div>
      <div class="key"><div class="big">${p.herdN?pct(p.withHerd,p.herdN):0}%</div><div class="lbl">Voted with the group</div></div>
      <div class="key"><div class="big">${p.missed}</div><div class="lbl">Deadlines missed</div></div>
    </div>
    <ul class="awards">${PICKS.map(line).join("")}</ul>
    ${bestT.length ? `<ul class="awards">
      <li><span>Reads them best</span><span class="pts">${bestT.map(([t,v])=>`${esc(t)} ${v.ok}/${v.n}`).join("<br>")}</span></li>
      <li><span>Hasn't a clue</span><span class="pts">${worstT.map(([t,v])=>`${esc(t)} ${v.ok}/${v.n}`).join("<br>")}</span></li>
    </ul>` : ""}
    <div class="chart-card"><div class="ctitle">Points per matchday</div>${barChartSVG(mdRows,{barH:14,leftW:52})}</div>
    ${refreshRow()}
  </section>`;
}

function wireStats(){
  wireCommon();
  $$(".segbtn[data-player]").forEach(b=> b.onclick = ()=>{ state.statPlayer=b.dataset.player; render(); window.scrollTo(0,0); });
  $("#backStats") && ($("#backStats").onclick = ()=>{ state.statPlayer=null; render(); });
}

   13. GO
   --------------------------------------------------------------- */
$$("#tabs button").forEach(b=> b.onclick = ()=>{
  state.tab = b.dataset.view; state.statPlayer = null; state.identityOpen = false;
  render(); window.scrollTo(0,0);
});
// A pick can lock while the page sits open on a Saturday afternoon.
setInterval(()=>{
  if(state.tab!=="predict" || state.identityOpen) return;
  if(document.activeElement === $("#bulkBox")) return;   // don't yank the caret mid-string
  render();
}, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(true); });
boot();
